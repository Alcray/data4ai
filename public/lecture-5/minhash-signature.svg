<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Four shared functions produce two comparable signatures</title>
  <desc id="desc">The four rows are shingle IDs. Their ranks under functions h1,h2,h3,h4 are 2,1,2,3; 1,4,3,2; 4,3,1,4; and 3,2,4,1. A takes minima over rows 1,2,3 and B over rows 1,2,4. Signatures A=(1,1,1,2) and B=(1,1,2,1) match in two of four coordinates.</desc>
  <style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.label{font-size:24px;fill:#6b7280}.word{font-size:25px}.number{font-size:28px;text-anchor:middle}.match{fill:#5b3fd4;font-weight:650}.summary{font-size:28px;fill:#5b3fd4;font-weight:650}</style>
  <text class="label" x="20" y="35">Shingle ID · same functions for every document</text>
  <text class="label" x="670" y="35" text-anchor="middle">h₁</text>
  <text class="label" x="825" y="35" text-anchor="middle">h₂</text>
  <text class="label" x="980" y="35" text-anchor="middle">h₃</text>
  <text class="label" x="1135" y="35" text-anchor="middle">h₄</text>
  <path d="M20 53H1180" stroke="#111827" stroke-width="2"/>
  <text class="word" x="20" y="94">1 · force equals mass</text>
  <text class="number" x="670" y="94">2</text><text class="number" x="825" y="94">1</text><text class="number" x="980" y="94">2</text><text class="number" x="1135" y="94">3</text>
  <path d="M20 111H1180" stroke="#e5e7eb"/>
  <text class="word" x="20" y="152">2 · equals mass times</text>
  <text class="number" x="670" y="152">1</text><text class="number" x="825" y="152">4</text><text class="number" x="980" y="152">3</text><text class="number" x="1135" y="152">2</text>
  <path d="M20 169H1180" stroke="#e5e7eb"/>
  <text class="word" x="20" y="210">3 · mass times acceleration</text>
  <text class="number" x="670" y="210">4</text><text class="number" x="825" y="210">3</text><text class="number" x="980" y="210">1</text><text class="number" x="1135" y="210">4</text>
  <path d="M20 227H1180" stroke="#e5e7eb"/>
  <text class="word" x="20" y="268">4 · mass times velocity</text>
  <text class="number" x="670" y="268">3</text><text class="number" x="825" y="268">2</text><text class="number" x="980" y="268">4</text><text class="number" x="1135" y="268">1</text>
  <path d="M20 285H1180" stroke="#e5e7eb"/>
  <rect x="625" y="313" width="90" height="111" rx="5" fill="#f2effe" stroke="#7253ed"/>
  <rect x="780" y="313" width="90" height="111" rx="5" fill="#f2effe" stroke="#7253ed"/>
  <text class="word" x="20" y="347">A · minima of rows 1,2,3</text>
  <text class="number match" x="670" y="347">1</text><text class="number match" x="825" y="347">1</text><text class="number" x="980" y="347">1</text><text class="number" x="1135" y="347">2</text>
  <text class="word" x="20" y="406">B · minima of rows 1,2,4</text>
  <text class="number match" x="670" y="406">1</text><text class="number match" x="825" y="406">1</text><text class="number" x="980" y="406">2</text><text class="number" x="1135" y="406">1</text>
  <text class="summary" x="600" y="471" text-anchor="middle">2 matching coordinates / 4 = 0.5</text>
</svg>
