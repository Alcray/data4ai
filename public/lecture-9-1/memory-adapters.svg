<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img"><title>For 40M adapters and the stated AdamW policy, BF16 LoRA state costs 16.72 GB and four-bit QLoRA state costs 4.72 GB before other allocations.</title><text x="40" y="47" font-family="Arial,sans-serif" font-size="32" fill="#111827" text-anchor="start" font-weight="700">40M trainable adapter parameters</text><text x="40" y="106" font-family="Arial,sans-serif" font-size="32" fill="#7253ED" text-anchor="start" font-weight="700">40 million × 18 bytes = 0.72 GB of adapter state</text><text x="40" y="194" font-family="Arial,sans-serif" font-size="29" fill="#111827" text-anchor="start" font-weight="700">Allocation</text><text x="650" y="194" font-family="Arial,sans-serif" font-size="29" fill="#111827" text-anchor="start" font-weight="700">BF16 LoRA</text><text x="1040" y="194" font-family="Arial,sans-serif" font-size="29" fill="#111827" text-anchor="start" font-weight="700">4-bit QLoRA</text><path d="M40 281L1360 281" fill="none" stroke="#D7DCE5" stroke-width="2"/><text x="40" y="261" font-family="Arial,sans-serif" font-size="29" fill="#111827" text-anchor="start" font-weight="400">Frozen 8B base</text><text x="650" y="261" font-family="Arial,sans-serif" font-size="32" fill="#7253ED" text-anchor="start" font-weight="700">16 GB</text><text x="1040" y="261" font-family="Arial,sans-serif" font-size="32" fill="#7253ED" text-anchor="start" font-weight="700">4 GB</text><path d="M40 343L1360 343" fill="none" stroke="#D7DCE5" stroke-width="2"/><text x="40" y="323" font-family="Arial,sans-serif" font-size="29" fill="#111827" text-anchor="start" font-weight="400">Trainable adapter state</text><text x="650" y="323" font-family="Arial,sans-serif" font-size="32" fill="#7253ED" text-anchor="start" font-weight="700">0.72 GB</text><text x="1040" y="323" font-family="Arial,sans-serif" font-size="32" fill="#7253ED" text-anchor="start" font-weight="700">0.72 GB</text><path d="M40 405L1360 405" fill="none" stroke="#D7DCE5" stroke-width="2"/><text x="40" y="385" font-family="Arial,sans-serif" font-size="29" fill="#111827" text-anchor="start" font-weight="400">State subtotal</text><text x="650" y="385" font-family="Arial,sans-serif" font-size="32" fill="#7253ED" text-anchor="start" font-weight="700">16.72 GB</text><text x="1040" y="385" font-family="Arial,sans-serif" font-size="32" fill="#7253ED" text-anchor="start" font-weight="700">4.72 GB</text><text x="40" y="467" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="700">Add to both</text><text x="390" y="467" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="400">Saved activations + runtime buffers</text><text x="40" y="530" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="700">Add to QLoRA</text><text x="390" y="530" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="400">NF4 metadata + unquantized base layers</text></svg>
