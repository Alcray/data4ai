<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img"><title>Count both keys and values across layers, tokens, heads and precision: 0.5 GiB for the specified 4096-token sequence.</title><text x="40" y="46" font-family="Arial,sans-serif" font-size="32" fill="#111827" text-anchor="start" font-weight="700">One sequence · 4,096 cached tokens · BF16</text><text x="100" y="137" font-family="Arial,sans-serif" font-size="38" fill="#7253ED" text-anchor="middle" font-weight="700">2</text><text x="100" y="183" font-family="Arial,sans-serif" font-size="24" fill="#111827" text-anchor="middle" font-weight="400">K and V</text><text x="200" y="137" font-family="Arial,sans-serif" font-size="30" fill="#111827" text-anchor="middle" font-weight="400">×</text><text x="300" y="137" font-family="Arial,sans-serif" font-size="38" fill="#7253ED" text-anchor="middle" font-weight="700">32</text><text x="300" y="183" font-family="Arial,sans-serif" font-size="24" fill="#111827" text-anchor="middle" font-weight="400">layers</text><text x="400" y="137" font-family="Arial,sans-serif" font-size="30" fill="#111827" text-anchor="middle" font-weight="400">×</text><text x="500" y="137" font-family="Arial,sans-serif" font-size="38" fill="#7253ED" text-anchor="middle" font-weight="700">1</text><text x="500" y="183" font-family="Arial,sans-serif" font-size="24" fill="#111827" text-anchor="middle" font-weight="400">sequence</text><text x="600" y="137" font-family="Arial,sans-serif" font-size="30" fill="#111827" text-anchor="middle" font-weight="400">×</text><text x="700" y="137" font-family="Arial,sans-serif" font-size="38" fill="#7253ED" text-anchor="middle" font-weight="700">4,096</text><text x="700" y="183" font-family="Arial,sans-serif" font-size="24" fill="#111827" text-anchor="middle" font-weight="400">tokens</text><text x="800" y="137" font-family="Arial,sans-serif" font-size="30" fill="#111827" text-anchor="middle" font-weight="400">×</text><text x="900" y="137" font-family="Arial,sans-serif" font-size="38" fill="#7253ED" text-anchor="middle" font-weight="700">8</text><text x="900" y="183" font-family="Arial,sans-serif" font-size="24" fill="#111827" text-anchor="middle" font-weight="400">KV heads</text><text x="1000" y="137" font-family="Arial,sans-serif" font-size="30" fill="#111827" text-anchor="middle" font-weight="400">×</text><text x="1100" y="137" font-family="Arial,sans-serif" font-size="38" fill="#7253ED" text-anchor="middle" font-weight="700">128</text><text x="1100" y="183" font-family="Arial,sans-serif" font-size="24" fill="#111827" text-anchor="middle" font-weight="400">head width</text><text x="1200" y="137" font-family="Arial,sans-serif" font-size="30" fill="#111827" text-anchor="middle" font-weight="400">×</text><text x="1300" y="137" font-family="Arial,sans-serif" font-size="38" fill="#7253ED" text-anchor="middle" font-weight="700">2</text><text x="1300" y="183" font-family="Arial,sans-serif" font-size="24" fill="#111827" text-anchor="middle" font-weight="400">bytes / value</text><rect x="40" y="232" width="1320" height="76" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><text x="700" y="282" font-family="Arial,sans-serif" font-size="34" fill="#7253ED" text-anchor="middle" font-weight="700">536,870,912 bytes = 0.5 GiB ≈ 0.537 GB</text><text x="40" y="382" font-family="Arial,sans-serif" font-size="28" fill="#111827" text-anchor="start" font-weight="700">1 sequence</text><text x="40" y="429" font-family="Arial,sans-serif" font-size="26" fill="#111827" text-anchor="start" font-weight="400">4,096 tokens</text><text x="40" y="493" font-family="Arial,sans-serif" font-size="36" fill="#7253ED" text-anchor="start" font-weight="700">0.5 GiB</text><text x="520" y="382" font-family="Arial,sans-serif" font-size="28" fill="#111827" text-anchor="start" font-weight="700">4 sequences</text><text x="520" y="429" font-family="Arial,sans-serif" font-size="26" fill="#111827" text-anchor="start" font-weight="40