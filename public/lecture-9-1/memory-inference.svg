<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img"><title>Inference weight and cache subtotals are 16.537 GB for BF16 and 4.537 GB for INT4; runtime and quantization costs are additional.</title><text x="40" y="46" font-family="Arial,sans-serif" font-size="32" fill="#111827" text-anchor="start" font-weight="700">8B weights + one 4,096-token BF16 cache</text><text x="40" y="119" font-family="Arial,sans-serif" font-size="29" fill="#111827" text-anchor="start" font-weight="700">Allocation</text><text x="660" y="119" font-family="Arial,sans-serif" font-size="29" fill="#111827" text-anchor="start" font-weight="700">BF16 weights</text><text x="1060" y="119" font-family="Arial,sans-serif" font-size="29" fill="#111827" text-anchor="start" font-weight="700">INT4 weights</text><path d="M40 212L1360 212" fill="none" stroke="#D7DCE5" stroke-width="2"/><text x="40" y="188" font-family="Arial,sans-serif" font-size="29" fill="#111827" text-anchor="start" font-weight="400">Weight payload</text><text x="660" y="188" font-family="Arial,sans-serif" font-size="32" fill="#7253ED" text-anchor="start" font-weight="700">16 GB</text><text x="1060" y="188" font-family="Arial,sans-serif" font-size="32" fill="#7253ED" text-anchor="start" font-weight="700">4 GB</text><path d="M40 284L1360 284" fill="none" stroke="#D7DCE5" stroke-width="2"/><text x="40" y="260" font-family="Arial,sans-serif" font-size="29" fill="#111827" text-anchor="start" font-weight="400">KV cache</text><text x="660" y="260" font-family="Arial,sans-serif" font-size="32" fill="#7253ED" text-anchor="start" font-weight="700">0.537 GB</text><text x="1060" y="260" font-family="Arial,sans-serif" font-size="32" fill="#7253ED" text-anchor="start" font-weight="700">0.537 GB</text><path d="M40 356L1360 356" fill="none" stroke="#D7DCE5" stroke-width="2"/><text x="40" y="332" font-family="Arial,sans-serif" font-size="29" fill="#111827" text-anchor="start" font-weight="400">Subtotal</text><text x="660" y="332" font-family="Arial,sans-serif" font-size="32" fill="#7253ED" text-anchor="start" font-weight="700">16.537 GB</text><text x="1060" y="332" font-family="Arial,sans-serif" font-size="32" fill="#7253ED" text-anchor="start" font-weight="700">4.537 GB</text><text x="40" y="416" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="700">Add to both</text><text x="390" y="416" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="400">Transient activations + execution buffers</text><text x="40" y="477" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="700">Add to INT4</text><text x="390" y="477" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="400">Quantization metadata + unquantized layers</text></svg>
