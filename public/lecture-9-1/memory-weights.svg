<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img"><title>BF16 uses 16 GB of raw weights; packed INT4 uses 4 GB, with quantization overhead added.</title><text x="40" y="52" font-family="Arial,sans-serif" font-size="34" fill="#111827" text-anchor="start" font-weight="700">8,000,000,000 parameters</text><text x="40" y="165" font-family="Arial,sans-serif" font-size="32" fill="#7253ED" text-anchor="start" font-weight="700">BF16</text><rect x="210" y="125" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="238" y="125" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="266" y="125" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="294" y="125" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="322" y="125" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="350" y="125" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="378" y="125" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="406" y="125" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="434" y="125" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="462" y="125" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="490" y="125" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="518" y="125" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="546" y="125" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="574" y="125" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="602" y="125" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="630" y="125" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><text x="210" y="221" font-family="Arial,sans-serif" font-size="28" fill="#111827" text-anchor="start" font-weight="400">16 bits = 2 bytes</text><text x="735" y="165" font-family="Arial,sans-serif" font-size="31" fill="#111827" text-anchor="start" font-weight="700">8 billion × 2 bytes = 16 GB</text><text x="40" y="355" font-family="Arial,sans-serif" font-size="32" fill="#7253ED" text-anchor="start" font-weight="700">INT4</text><rect x="210" y="315" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="238" y="315" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="266" y="315" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><rect x="294" y="315" width="25" height="52" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><text x="210" y="411" font-family="Arial,sans-serif" font-size="28" fill="#111827" text-anchor="start" font-weight="400">4 bits = 0.5 bytes</text><text x="735" y="355" font-family="Arial,sans-serif" font-size="31" fill="#111827" text-anchor="start" font-weight="700">8 billion × 0.5 bytes = 4 GB</text><text x="735" y="450" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="400">+ scales / zero points</text><text x="735" y="490" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="400">+ higher-precision layers</text><text x="40" y="535" font-family="Arial,sans-serif" font-size="25" fill="#111827" text-anchor="start" font-weight="400">GB = 1 billion bytes</text></svg>
