<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img"><title>A 4096 by 4096 BF16 hidden-state tensor is 32 MiB; saving one in each of 32 layers is 1 GiB for one sequence.</title><text x="40" y="50" font-family="Arial,sans-serif" font-size="32" fill="#111827" text-anchor="start" font-weight="700">One BF16 hidden-state tensor</text><text x="40" y="145" font-family="Arial,sans-serif" font-size="42" fill="#7253ED" text-anchor="start" font-weight="700">1</text><text x="40" y="190" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="400">sequence</text><text x="350" y="145" font-family="Arial,sans-serif" font-size="42" fill="#7253ED" text-anchor="start" font-weight="700">4,096</text><text x="350" y="190" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="400">tokens</text><text x="660" y="145" font-family="Arial,sans-serif" font-size="42" fill="#7253ED" text-anchor="start" font-weight="700">4,096</text><text x="660" y="190" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="400">hidden values</text><text x="1000" y="145" font-family="Arial,sans-serif" font-size="42" fill="#7253ED" text-anchor="start" font-weight="700">2 bytes</text><text x="1000" y="190" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="400">per value</text><text x="280" y="145" font-family="Arial,sans-serif" font-size="34" fill="#111827" text-anchor="start" font-weight="400">×</text><text x="590" y="145" font-family="Arial,sans-serif" font-size="34" fill="#111827" text-anchor="start" font-weight="400">×</text><text x="930" y="145" font-family="Arial,sans-serif" font-size="34" fill="#111827" text-anchor="start" font-weight="400">×</text><rect x="40" y="235" width="1320" height="70" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><text x="700" y="282" font-family="Arial,sans-serif" font-size="36" fill="#7253ED" text-anchor="middle" font-weight="700">33,554,432 bytes = 32 MiB</text><text x="40" y="363" font-family="Arial,sans-serif" font-size="29" fill="#111827" text-anchor="start" font-weight="700">One saved tensor per layer</text><text x="40" y="423" font-family="Arial,sans-serif" font-size="31" fill="#111827" text-anchor="start" font-weight="400">32 layers × 32 MiB</text><text x="650" y="423" font-family="Arial,sans-serif" font-size="34" fill="#7253ED" text-anchor="start" font-weight="700">1 GiB ≈ 1.074 GB</text><text x="40" y="488" font-family="Arial,sans-serif" font-size="29" fill="#111827" text-anchor="start" font-weight="400">Four sequences: these tensors use 4 GiB</text><text x="40" y="540" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="400">Also stored: other attention / feed-forward intermediates</text></svg>
