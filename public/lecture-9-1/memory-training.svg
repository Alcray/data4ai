<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img"><title>Full-parameter pretraining, CPT and SFT share a 144 GB state subtotal under the specified mixed-precision AdamW policy.</title><text x="40" y="42" font-family="Arial,sans-serif" font-size="32" fill="#111827" text-anchor="start" font-weight="700">8B parameters · BF16 compute · AdamW</text><text x="40" y="106" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="700">Stored tensor</text><text x="640" y="106" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="700">Bytes / parameter</text><text x="1040" y="106" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="700">8B total</text><path d="M40 171L1360 171" fill="none" stroke="#D7DCE5" stroke-width="2"/><text x="40" y="155" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="400">Working weights · BF16</text><text x="690" y="155" font-family="Arial,sans-serif" font-size="28" fill="#7253ED" text-anchor="start" font-weight="700">2</text><text x="1040" y="155" font-family="Arial,sans-serif" font-size="28" fill="#111827" text-anchor="start" font-weight="700">16 GB</text><path d="M40 224L1360 224" fill="none" stroke="#D7DCE5" stroke-width="2"/><text x="40" y="208" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="400">Accumulated gradients · FP32</text><text x="690" y="208" font-family="Arial,sans-serif" font-size="28" fill="#7253ED" text-anchor="start" font-weight="700">4</text><text x="1040" y="208" font-family="Arial,sans-serif" font-size="28" fill="#111827" text-anchor="start" font-weight="700">32 GB</text><path d="M40 277L1360 277" fill="none" stroke="#D7DCE5" stroke-width="2"/><text x="40" y="261" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="400">Master weights · FP32</text><text x="690" y="261" font-family="Arial,sans-serif" font-size="28" fill="#7253ED" text-anchor="start" font-weight="700">4</text><text x="1040" y="261" font-family="Arial,sans-serif" font-size="28" fill="#111827" text-anchor="start" font-weight="700">32 GB</text><path d="M40 330L1360 330" fill="none" stroke="#D7DCE5" stroke-width="2"/><text x="40" y="314" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="400">AdamW first moment · FP32</text><text x="690" y="314" font-family="Arial,sans-serif" font-size="28" fill="#7253ED" text-anchor="start" font-weight="700">4</text><text x="1040" y="314" font-family="Arial,sans-serif" font-size="28" fill="#111827" text-anchor="start" font-weight="700">32 GB</text><path d="M40 383L1360 383" fill="none" stroke="#D7DCE5" stroke-width="2"/><text x="40" y="367" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="400">AdamW second moment · FP32</text><text x="690" y="367" font-family="Arial,sans-serif" font-size="28" fill="#7253ED" text-anchor="start" font-weight="700">4</text><text x="1040" y="367" font-family="Arial,sans-serif" font-size="28" fill="#111827" text-anchor="start" font-weight="700">32 GB</text><rect x="40" y="430" width="1320" height="64" rx="4" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><text x="62" y="472" font-family="Arial,sans-serif" font-size="29" fill="#111827" text-anchor="start" font-weight="700">Persistent state</text><text x="645" y="472" font-family="Arial,sans-serif" font-size="28" fill="#111827" text-anchor="start" font-weight="400">18 bytes / parameter</text><text x="1040" y="472" font-family="Arial,sans-serif" font-size="32" fill="#7253ED" text-anchor="start" font-weight="700">144 GB</text><text x="40" y="540" font-family="Arial,sans-serif" font-size="27" fill="#111827" text-anchor="start" font-weight="400">Additional memory: saved activations + temporary buffers + runtime</text></svg>
