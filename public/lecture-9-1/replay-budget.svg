<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img"><title>A 10M-token budget split into 7M domain and 3M replay tokens</title><text x="50" y="85" font-family="Arial,sans-serif" font-size="36" fill="#111827" text-anchor="start" font-weight="700">10 million training tokens</text><rect x="50" y="190" width="910" height="115" rx="5" fill="#7253ED" stroke="#7253ED" stroke-width="2"/><rect x="960" y="190" width="390" height="115" rx="5" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><text x="505" y="255" font-family="Arial,sans-serif" font-size="34" fill="white" text-anchor="middle" font-weight="700">7M domain tokens</text><text x="1155" y="255" font-family="Arial,sans-serif" font-size="32" fill="#7253ED" text-anchor="middle" font-weight="700">3M replay</text><text x="505" y="365" font-family="Arial,sans-serif" font-size="42" fill="#7253ED" text-anchor="middle" font-weight="700">70%</text><text x="1155" y="365" font-family="Arial,sans-serif" font-size="42" fill="#7253ED" text-anchor="middle" font-weight="700">30%</text></svg>
