<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Build an inverted index during the initial scan</title><desc id="desc">Each scanned pair appends its stable left-node handle to that pair's posting list. Doc1 produces a,b at D1:n0, b,a at D1:n1, then another a,b at D1:n2. Continuing with Doc2 adds a,b at D2:n0, b,a at D2:n1 and a,c at D2:n2. The final posting-list lengths are3,2,1, matching the count map. Handles refer to token nodes, not shifted string offsets.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="12" y="35" class="muted" font-size="29">D1:n0 = Doc 1, left node 0</text><g data-scan-position="0:0" data-pair="97,98" data-positions="0:0"><text x="12" y="106" class="mono" font-size="32">D1:n0</text><text x="215" y="106" class="mono accent" font-size="32">(a,b)</text><path class="edge" d="M385 96H450"/><text x="490" y="106" class="mono" font-size="32">[D1:n0]</text></g><g data-scan-position="0:1" data-pair="98,97" data-positions="0:1"><text x="12" y="184" class="mono" font-size="32">D1:n1</text><text x="215" y="184" class="mono accent" font-size="32">(b,a)</text><path class="edge" d="M385 174H450"/><text x="490" y="184" class="mono" font-size="32">[D1:n1]</text></g><g data-scan-position="0:2" data-pair="97,98" data-positions="0:0;0:2"><text x="12" y="262" class="mono" font-size="32">D1:n2</text><text x="215" y="262" class="mono accent" font-size="32">(a,b)</text><path class="edge" d="M385 252H450"/><text x="490" y="262" class="mono" font-size="32">[D1:n0, D1:n2]</text></g><path d="M12 313H1240" stroke="#e5e7eb"/><text x="12" y="362" class="accent" font-size="29" font-weight="600">After both documents: pair → occurrence handles</text><g data-index-pair="97,98" data-positions="0:0;0:2;1:0"><text x="12" y="418" class="mono" font-size="32">(a,b)</text><text x="235" y="418" class="mono" font-size="32">[D1:n0, D1:n2, D2:n0]</text></g><g data-index-pair="98,97" data-positions="0:1;1:1"><text x="12" y="478" class="mono" font-size="32">(b,a)</text><text x="235" y="478" class="mono" font-size="32">[D1:n1, D2:n1]</text></g><g data-index-pair="97,99" data-positions="1:2"><text x="12" y="538" class="mono" font-size="32">(a,c)</text><text x="235" y="538" class="mono" font-size="32">[D2:n2]</text></g></svg>
