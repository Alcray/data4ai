<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 450" role="img" aria-labelledby="title desc"><title id="title">One character, different UTF-8 byte lengths</title><desc id="desc">English A encodes as hex 41, one byte. Russian Я encodes as D0 AF, two bytes. Chinese 中 encodes as E4 B8 AD, three bytes. Each outlined box is one byte. These are specific characters in UTF-8, not universal byte counts for every character used by a language.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><g data-character="A" data-bytes="65"><text x="12" y="100" class="label" font-size="30">English</text><text x="285" y="108" class="" font-size="70" text-anchor="middle">A</text><path class="edge" d="M375 82H455"/><rect class="token violet" x="490" y="42" width="118" height="78" rx="8"/><text x="549" y="94" class="mono" font-size="38" text-anchor="middle">41</text><text x="1050" y="100" class="accent" font-size="36" font-weight="600">1 byte</text></g><g data-character="Я" data-bytes="208,175"><text x="12" y="245" class="label" font-size="30">Russian</text><text x="285" y="253" class="" font-size="70" text-anchor="middle">Я</text><path class="edge" d="M375 227H455"/><rect class="token violet" x="490" y="187" width="118" height="78" rx="8"/><text x="549" y="239" class="mono" font-size="38" text-anchor="middle">D0</text><rect class="token teal" x="630" y="187" width="118" height="78" rx="8"/><text x="689" y="239" class="mono" font-size="38" text-anchor="middle">AF</text><text x="1050" y="245" class="accent" font-size="36" font-weight="600">2 bytes</text></g><g data-character="中" data-bytes="228,184,173"><text x="12" y="390" class="label" font-size="30">Chinese</text><text x="285" y="398" class="" font-size="70" text-anchor="middle">中</text><path class="edge" d="M375 372H455"/><rect class="token violet" x="490" y="332" width="118" height="78" rx="8"/><text x="549" y="384" class="mono" font-size="38" text-anchor="middle">E4</text><rect class="token teal" x="630" y="332" width="118" height="78" rx="8"/><text x="689" y="384" class="mono" font-size="38" text-anchor="middle">B8</text><rect class="token amber" x="770" y="332" width="118" height="78" rx="8"/><text x="829" y="384" class="mono" font-size="38" text-anchor="middle">AD</text><text x="1050" y="390" class="accent" font-size="36" font-weight="600">3 bytes</text></g></svg>
