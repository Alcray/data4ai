<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Follow one posting and update only its current neighboring edges</title><desc id="desc">First follow D1:n0. Doc1 a,b,a,b becomes256,a,b. Reuse node0 for ab, unlink node1, and link node0 to node2. Remove a,b at D1:n0, changing count3 to2; remove b,a at D1:n1, changing2 to1; add256,a at D1:n0, changing0 to1. The a,b occurrence at stable node2 remains indexed. No left-neighbor edge exists at this document boundary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="12" y="35" class="accent" font-size="32" font-weight="600">First posting: D1:n0</text><text x="12" y="132" class="label" >Before</text><g data-node="0" data-token="97"><rect class="token teal selected" x="195" y="96" width="90" height="58" rx="7"/><text x="240" y="136" class="mono" font-size="35" text-anchor="middle">a</text><text x="240" y="183" class="mono muted" font-size="22" text-anchor="middle">n0</text></g><path class="edge" d="M289 120H316"/><path class="edge" d="M316 130H289"/><g data-node="1" data-token="98"><rect class="token violet selected" x="320" y="96" width="90" height="58" rx="7"/><text x="365" y="136" class="mono" font-size="35" text-anchor="middle">b</text><text x="365" y="183" class="mono muted" font-size="22" text-ancho