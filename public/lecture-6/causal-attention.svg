<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Causal attention hides future inputs</title><desc id="desc">Constructed five-input example BOS a b c d. Rows are query positions and columns are key positions. Filled cells allow the current or an earlier key. The highlighted query b can read BOS a b but cannot read c or d; c is its next-token target. This is autoregressive prediction, not reconstruction of a visible token.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="310" y="65" class="muted" font-size="25" text-anchor="middle">Keys: inputs you can read</text><text x="198" y="130" class="mono muted" font-size="24" text-anchor="middle">BOS</text><text x="254" y="130" class="mono muted" font-size="24" text-anchor="middle">a</text><text x="310" y="130" class="mono muted" font-size="24" text-anchor="middle">b</text><text x="366" y="130" class="mono muted" font-size="24" text-anchor="middle">c</text><text x="422" y="130" class="mono muted" font-size="24" text-anchor="middle">d</text><text x="150" y="186" class="mono muted" font-size="24" text-anchor="end">BOS</text><rect data-mask="causal" data-query="0" data-key="0" data-allowed="1" data-reason="" x="170" y="150" width="56" height="56" fill="#c5b6f6" stroke="#d6dae3"/><rect data-mask="causal" data-query="0" data-key="1" data-allowed="0" data-reason="future" x="226" y="150" width="56" height="56" fill="#fff" stroke="#d6dae3"/><rect data-mask="causal" data-query="0" data-key="2" data-allowed="0" data-reason="future" x="282" y="150" width="56" height="56" fill="#fff" stroke="#d6dae3"/><rect data-mask="causal" data-query="0" data-key="3" data-allowed="0" data-reason="future" x="338" y="150" width="56" height="56" fill="#fff" stroke="#d6dae3"/><rect data-mask="causal" data-query="0" data-key="4" data-allowed="0" data-reason="future" x="394" y="150" width="56" height="56" fill="#fff" stroke="#d6dae3"/><text x="150" y="242" class="mono muted" font-size="24" text-anchor="end">a</text><rect data-mask="causal" data-query="1" data-key="0" data-allowed="1" data-reason="" x="170" y="206" width="56" height="56" fill="#c5b6f6" stroke="#d6dae3"/><rect data-mask="causal" data-query="1" data-key="1" data-allowed="1" data-reason="" x="226" y="206" width="56" height="56" fill="#c5b6f6" stroke="#d6dae3"/><rect data-mask="causal" data-query="1" data-key="2" data-allowed="0" data-reason="future" x="282" y="206" width="56" height="56" fill="#fff" stroke="#d6dae3"/><rect data-mask="causal" data-query="1" data-key="3" data-allowed="0" data-reason="future" x="338" y="206" width="56" height="56" fill="#fff" stroke="#d6dae3"/><rect data-mask="causal" data-query="1" data-key="4" data-allowed="0" data-reason="future" x="394" y="206" width="56" height="56" fill="#fff" stroke="#d6dae3"/><text x="150" y="298" class="mono muted" font-size="24" text-anchor="end">b</text><rect data-mask="causal" data-query="2" data-key="0" data-allowed="1" data-reason="" x="170" y="262" width="56" height="56" fill="#c5b6f6" stroke="#d6dae3"/><rect data-mask="causal" data-query="2" data-key="1" data-allowed="1" data-reason="" x="226" y="262" width="56" height="56" fill="#c5b6f6" stroke="#d6dae3"/><rect data-mask="causal" data-query="2" data-key="2" data-allowed="1" data-reason="" x="282" y="262" width="56" height="56" fill="#c5b6f6" stroke="#d6dae3"/><rect data-mask="causal" data-query="2" data-key="3" data-allowed="0" data-reason="future" x="338" y="262" width="56" height="56" fill="#fff" stroke="#d6dae3"/><rect data-mask="causal" data-query="2" data-key="4" data-allowed="0" data-reason="future" x="394" y="262" width="56" height="56" fill="#fff" stroke="#d6dae3"/><text x="150" y="354" class="mono muted" font-size="24" text-anchor="end">c</text><rect data-mask="causal" data-query="3" data-key="0" data-allowed="1" data-reason="" x="170" y="318" width="56" height="56" fill="#c5b6f6" stroke="#d6dae3"/><rect data-mask="causal" data-query="3" data-key="1" data-allowed="1" data-reason="" x="226" y="318" width="56" height="56" fill="#c5b6f6" stroke="#d6dae3"/><rect data-mask="causal" data-query="3" data-key="2" data-allowed="1" data-reason="" x="282" y="318" width="56" height="56" fill="#c5b6f6" stroke="#d6dae3"/><rect data-mask="causal" data-query="3" data-key="3" data-allowed="1" data-reason="" x="338" y="318" width="56" height="56" fill="#c5b6f6" stroke="#d6dae3"/><rect data-mask="causal" data-query="3" data-key="4" data-allowed="0" data-reason="future" x="394" y="318" width="56" height="56" fill="#fff" stroke="#d6dae3"/><text x="150" y="410" class="mono muted" font-size="24" text-anchor="end">d</text><rect data-mask="causal" data-query="4" data-key="0" data-allowed="1" data-reason="" x="170" y="374" width="56" height="56" fill="#c5b6f6" stroke="#d6dae3"/><rect data-mask="causal" data-query="4" data-key="1" data-allowed="1" data-reason="" x="226" y="374" width="56" height="56" fill="#c5b6f6" stroke="#d6dae3"/><rect data-mask="causal" data-query="4" data-key="2" data-allowed="1" data-reason="" x="282" y="374" width="56" height="56" fill="#c5b6f6" stroke="#d6dae3"/><rect data-mask="causal" data-query="4" data-key="3" data-allowed="1" data-reason="" x="338" y="374" width="56" height="56" fill="#c5b6f6" stroke="#d6dae3"/><rect data-mask="causal" data-query="4" data-key="4" data-allowed="1" data-reason="" x="394" y="374" width="56" height="56" fill="#c5b6f6" stroke="#d6dae3"/><rect x="168" y="260" width="284" height="60" fill="none" stroke="#7253ed" stroke-width="3"/><text x="20" y="115" class="muted" font-size="24">Query</text><text x="675" y="145" class="" font-size="32">Query b can read</text><rect x="675" y="190" width="105" height="70" rx="8" fill="#f2effe" stroke="#d6dae3" stroke-width="1.5"/><text x="727.5" y="235" class="" font-size="27" text-anchor="middle">BOS</text><rect x="795" y="190" width="105" height="70" rx="8" fill="#f2effe" stroke="#d6dae3" stroke-width="1.5"/><text x="847.5" y="235" class="" font-size="27" text-anchor="middle">a</text><rect x="915" y="190" width="105" height="70" rx="8" fill="#f2effe" stroke="#d6dae3" stroke-width="1.5"/><text x="967.5" y="235" class="" font-size="27" text-anchor="middle">b</text><text x="675" y="337" class="accent" font-size="35" font-weight="600">Predict next token: c</text><text x="675" y="409" class="muted" font-size="28">c and d are future inputs</text><text x="20" y="539" class="accent" font-size="31" font-weight="600">Read the prefix → predict the next token</text></svg>
