<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">Text before and after</title><desc id="desc">Seven before-and-after examples: e plus a combining acute accent becomes é; full-width a becomes a; the ffi ligature becomes ffi; circled one becomes 1; HELLO becomes hello; եվ becomes և; 7 becomes seven. Each row is a separate example, not a combined processing sequence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><g data-before="e + ◌́" data-after="é"><text x="480" y="54" class="" font-size="46" text-anchor="end">e + ◌́</text><text x="625" y="54" class="accent" font-size="42" text-anchor="middle">→</text><text x="760" y="54" class="" font-size="46">é</text></g><g data-before="ａ" data-after="a"><text x="480" y="122" class="" font-size="46" text-anchor="end">ａ</text><text x="625" y="122" class="accent" font-size="42" text-anchor="middle">→</text><text x="760" y="122" class="" font-size="46">a</text></g><g data-before="ﬃ" data-after="ffi"><text x="480" y="190" class="" font-size="46" text-anchor="end">ﬃ</text><text x="625" y="190" class="accent" font-size="42" text-anchor="middle">→</text><text x="760" y="190" class="" font-size="46">ffi</text></g><g data-before="①" data-after="1"><text x="480" y="258" class="" font-size="46" text-anchor="end">①</text><text x="625" y="258" class="accent" font-size="42" text-anchor="middle">→</text><text x="760" y="258" class="" font-size="46">1</text></g><g data-before="HELLO" data-after="hello"><text x="480" y="326" class="" font-size="46" text-anchor="end">HELLO</text><text x="625" y="326" class="accent" font-size="42" text-anchor="middle">→</text><text x="760" y="326" class="" font-size="46">hello</text></g><g data-before="եվ" data-after="և"><text x="480" y="394" class="" font-size="46" text-anchor="end">եվ</text><text x="625" y="394" class="accent" font-size="42" text-anchor="middle">→</text><text x="760" y="394" class="" font-size="46">և</text></g><g data-before="7" data-after="seven"><text x="480" y="462" class="" font-size="46" text-anchor="end">7</text><text x="625" y="462" class="accent" font-size="42" text-anchor="middle">→</text><text x="760" y="462" class="" font-size="46">seven</text></g></svg>
