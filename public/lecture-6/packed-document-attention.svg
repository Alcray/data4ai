<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Causal attention versus independent-document packing</title><desc id="desc">Six real inputs: A0 BOS,A1 a,A2 b,B0 BOS,B1 c,B2 d. Rows query columns. Ordinary causal attention allows21 connections including9 B-to-A cross-document connections. Adding matching document identity allows12 within-document causal connections, arranged as two lower-triangular diagonal blocks. Grey crossed cells are blocked other-document reads; white cells are blocked future inputs. EOS or position resets alone do not create this isolation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="250" y="42" class="" font-size="31" text-anchor="middle">Only causal</text><text x="940" y="42" class="" font-size="31" text-anchor="middle">Causal + same document</text><text x="250" y="77" class="muted" font-size="23" text-anchor="middle">Keys →</text><text x="940" y="77" class="muted" font-size="23" text-anchor="middle">Keys →</text><text x="125" y="110" class="mono muted" font-size="24" text-anchor="middle">A0</text><text x="175" y="110" class="mono muted" font-size="24" text-anchor="middle">A1</text><text x="225" y="110" class="mono muted" font-size="24" text-anchor="middle">A2</text><text x="275" y="110" class="mono muted" font-size