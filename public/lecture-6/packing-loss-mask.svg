<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Loss mask selects shifted targets, not attention visibility</title><desc id="desc">The same eight-slot pre-shifted fixture: inputs BOS a b BOS c d PAD PAD, targets a b EOS c d EOS PAD PAD, loss mask0 1 1 0 1 1 0 0. This constructed context/answer policy ignores targets a and c but leaves their input tokens visible to later allowed queries. Four targets are scored. Full-document pretraining could score all six real targets. A loss mask is not an attention barrier.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="12" y="42" class="muted" font-size="25">Packed slot</text><text x="295" y="42" class="mono muted" font-size="25" text-anchor="middle">0</text><text x="415" y="42" class="mono muted" font-size="25" text-anchor="middle">1</text><text x="535" y="42" class="mono muted" font-size="25" text-anchor="middle">2</text><text x="655" y="42" class="mono muted" font-size="25" text-anchor="middle">3</text><text x="775" y="42" class="mono muted" font-size="25" text-anchor="middle">4</text><text x="895" y="42" class="mono muted" font-size="25" text-anchor="middle">5</text><text x="1015" y="42" class="mono muted" font-size="25" text-anchor="middle">6</text><text x="1135" y="42" class="mono muted" font-size="25" text-anchor="middle">7</text><text x="415" y="81" class="accent" font-size="26" text-anchor="middle">Document A</text><text x="775" y="81" class="accent" font-size="26" text-anchor="middle">Document B</text><text x="1075" y="81" class="muted" font-size="26" text-anchor="middle">Padding</text><path d="M595 92V447M955 92V447" stroke="#d6dae3" stroke-dasharray="5 6"/><g data-field="input" data-values="BOS,a,b,BOS,c,d,PAD,PAD"><text x="12" y="141" class="" font-size="28">Input</text><g data-slot="0" data-value="BOS"><rect x="240" y="100" width="110" height="60" rx="6" fill="#fff" stroke="#d6dae3"/><text x="295" y="140" class="mono" font-size="28" text-anchor="middle">BOS</text></g><g data-slot="1" data-value="a"><rect x="360" y="100" width="110" height="60" rx="6" fill="#fff" stroke="#d6dae3"/><text x="415" y="140" class="mono" font-size="28" text-anchor="middle">a</text></g><g data-slot="2" data-value="b"><rect x="480" y="100" width="110" height="60" rx="6" fill="#fff" stroke="#d6dae3"/><text x="535" y="140" class="mono" font-size="28" text-anchor="middle">b</text></g><g data-slot="3" data-value="BOS"><rect x="600" y="100" width="110" height="60" rx="6" fill="#fff" stroke="#d6dae3"/><text x="655" y="140" class="mono" font-size="28" text-anchor="middle">BOS</text></g><g data-slot="4" data-value="c"><rect x="720" y="100" width="110" height="60" rx="6" fill="#fff" stroke="#d6dae3"/><text x="775" y="140" class="mono" font-size="28" text-anchor="middle">c</text></g><g data-slot="5" data-value="d"><rect x="840" y="100" width="110" height="60" rx="6" fill="#fff" stroke="#d6dae3"/><text x="895" y="140" class="mono" font-size="28" text-anchor="middle">d</text></g><g data-slot="6" data-value="PAD"><rect x="960" y="100" width="110" height="60" rx="6" fill="#f6f7f9" stroke="#d6dae3"/><text x="1015" y="140" class="mono muted" font-size="28" text-anchor="middle">PAD</text></g><g data-slot="7" data-value="PAD"><rect x="1080" y="100" width="110" height="60" rx="6" fill="#f6f7f9" stroke="#d6dae3"/><text x="1135" y="140" class="mono muted" font-size="28" text-anchor="middle">PAD</text></g></g><g data-field="target" data-values="a,b,EOS,c,d,EOS,PAD,PAD"><text x="12" y="276" class="" font-size="28">Target</text><g data-slot="0" data-value="a"><rect x="240" y="235" width="110" height="60" rx="6" fill="#fff" stroke="#d6dae3"/><text x="295" y="275" class="mono" font-size="28" text-anchor="middle">a</text></g><g data-slot="1" data-value="b"><rect x="360" y="235" width="110" height="60" rx="6" fill="#f2effe" stroke="#b6a4f2"/><text x="415" y="275" class="mono accent" font-size="28" text-anchor="middle">b</text></g><g data-slot="2" data-value="EOS"><rect x="480" y="235" width="110" height="60" rx="6" fill="#f2effe" stroke="#b6a4f2"/><text x="535" y="275" class="mono accent" font-size="28" text-anchor="middle">EOS</text></g><g data-slot="3" data-value="c"><rect x="600" y="235" width="110" height="60" rx="6" fill="#fff" stroke="#d6dae3"/><text x="655" y="275" class="mono" font-size="28" text-anchor="middle">c</text></g><g data-slot="4" data-value="d"><rect x="720" y="235" width="110" height="60" rx="6" fill="#f2effe" stroke="#b6a4f2"/><text x="775" y="275" class="mono accent" font-size="28" text-anchor="middle">d</text></g><g data-slot="5" data-value="EOS"><rect x="840" y="235" width="110" height="60" rx="6" fill="#f2effe" stroke="#b6a4f2"/><text x="895" y="275" class="mono accent" font-size="28" text-anchor="middle">EOS</text></g><g data-slot="6" data-value="PAD"><rect x="960" y="235" width="110" height="60" rx="6" fill="#f6f7f9" stroke="#d6dae3"/><text x="1015" y="275" class="mono muted" font-size="28" text-anchor="middle">PAD</text></g><g data-slot="7" data-value="PAD"><rect x="1080" y="235" width="110" height="60" rx="6" fill="#f6f7f9" stroke="#d6dae3"/><text x="1135" y="275" class="mono muted" font-size="28" text-anchor="middle">PAD</text></g></g><g data-field="loss" data-values="0,1,1,0,1,1,0,0"><text x="12" y="411" class="" font-size="28">Loss mask</text><g data-slot="0" data-value="0"><rect x="240" y="370" width="110" height="60" rx="6" fill="#fff" stroke="#d6dae3"/><text x="295" y="410" class="mono" font-size="28" text-anchor="middle">0</text></g><g data-slot="1" data-value="1"><rect x="360" y="370" width="110" height="60" rx="6" fill="#f2effe" stroke="#b6a4f2"/><text x="415" y="410" class="mono accent" font-size="28" text-anchor="middle">1</text></g><g data-slot="2" data-value="1"><rect x="480" y="370" width="110" height="60" rx="6" fill="#f2effe" stroke="#b6a4f2"/><text x="535" y="410" class="mono accent" font-size="28" text-anchor="middle">1</text></g><g data-slot="3" data-value="0"><rect x="600" y="370" width="110" height="60" rx="6" fill="#fff" stroke="#d6dae3"/><text x="655" y="410" class="mono" font-size="28" text-anchor="middle">0</text></g><g data-slot="4" data-value="1"><rect x="720" y="370" width="110" height="60" rx="6" fill="#f2effe" stroke="#b6a4f2"/><text x="775" y="410" class="mono accent" font-size="28" text-anchor="middle">1</text></g><g data-slot="5" data-value="1"><rect x="840" y="370" width="110" height="60" rx="6" fill="#f2effe" stroke="#b6a4f2"/><text x="895" y="410" class="mono accent" font-size="28" text-anchor="middle">1</text></g><g data-slot="6" data-value="0"><rect x="960" y="370" width="110" height="60" rx="6" fill="#f6f7f9" stroke="#d6dae3"/><text x="1015" y="410" class="mono muted" font-size="28" text-anchor="middle">0</text></g><g data-slot="7" data-value="0"><rect x="1080" y="370" width="110" height="60" rx="6" fill="#f6f7f9" stroke="#d6dae3"/><text x="1135" y="410" class="mono muted" font-size="28" text-anchor="middle">0</text></g></g><text x="12" y="497" class="muted" font-size="28">Context-only targets: a, c</text><text x="880" y="497" class="accent" font-size="28">4 scored targets</text></svg>
