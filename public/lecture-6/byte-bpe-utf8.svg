<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">UTF-8 bytes become initial byte-BPE tokens</title><desc id="desc">café becomes hex bytes 63 61 66 C3 A9. The first three bytes represent c, a, f and continue unchanged. C3 and A9 are separate initial byte tokens, not independently decodable characters. Their branches join a single downward arrow into the merged bytes of é. The declared merge illustrates byte representation, not a released vocabulary or a frequency-trained merge table.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="12" y="42" class="" font-size="38">Text: café</text><text x="12" y="105" class="label" >UTF-8 bytes</text><text x="12" y="217" class="label" >Base tokens</text><text x="12" y="335" class="label" >One learned merge</text><rect class="token violet" x="285" y="65" width="118" height="66" rx="8"/><text x="344" y="109" class="mono" font-size="32" text-anchor="middle">63</text><path class="edge" d="M344 137V172"/><rect class="token violet" x="285" y="180" width="118" height="66" rx="8"/><text x="344" y="222" class="mono" font-size="29" text-anchor="middle">c</text><rect class="token teal" x="430" y="65" width="118" height="66" rx="8"/><text x="489" y="109" class="mono" font-size="32" text-anchor="middle">61</text><path class="edge" d="M489 137V172"/><rect class="token teal" x="430" y="180" width="118" height="66" rx="8"/><text x="489" y="222" class="mono" font-size="29" text-anchor="middle">a</text><rect class="token amber" x="575" y="65" width="118" height="66" rx="8"/><text x="634" y="109" class="mono" font-size="32" text-anchor="middle">66</text><path class="edge" d="M634 137V172"/><rect class="token amber" x="575" y="180" width="118" height="66" rx="8"/><text x="634" y="222" class="mono" font-size="29" text-anchor="middle">f</text><rect class="token blue" x="720" y="65" width="118" height="66" rx="8"/><text x="779" y="109" class="mono" font-size="32" text-anchor="middle">C3</text><path class="edge" d="M779 137V172"/><rect class="token blue" x="720" y="180" width="118" height="66" rx="8"/><text x="779" y="222" class="mono" font-size="29" text-anchor="middle">0xC3</text><rect class="token rose" x="865" y="65" width="118" height="66" rx="8"/><text x="924" y="109" class="mono" font-size="32" text-anchor="middle">A9</text><path class="edge" d="M924 137V172"/><rect class="token rose" x="865" y="180" width="118" height="66" rx="8"/><text x="924" y="222" class="mono" font-size="29" text-anchor="middle">0xA9</text><path class="edge" data-unchanged-byte="99" d="M344 251V288"/><rect class="token violet" x="285" y="294" width="118" height="66" rx="8"/><text x="344" y="337" class="mono" font-size="32" text-anchor="middle">c</text><path class="edge" data-unchanged-byte="97" d="M489 251V288"/><rect class="token teal" x="430" y="294" width="118" height="66" rx="8"/><text x="489" y="337" class="mono" font-size="32" text-anchor="middle">a</text><path class="edge" data-unchanged-byte="102" d="M634 251V288"/><rect class="token amber" x="575" y="294" width="118" height="66" rx="8"/><text x="634" y="337" class="mono" font-size="32" text-anchor="middle">f</text><g data-merge="195,169" data-result="256"><path data-merge-branches="C3,A9" d="M779 251V264H924V251" fill="none" stroke="#7253ed" stroke-width="2.5"/><path class="edge" data-merge-arrow="C3,A9" d="M851.5 264V288"/><rect class="token rose selected" x="720" y="294" width="263" height="66" rx="8"/><text x="851.5" y="337" class="mono" font-size="36" text-anchor="middle">é</text></g><text x="285" y="423" class="" font-size="27">C3 + A9 → C3 A9 (é) · A base byte need not be a complete character.</text><text x="285" y="469" class="muted" font-size="24">All 256 byte values are available before learning merges.</text></svg>
