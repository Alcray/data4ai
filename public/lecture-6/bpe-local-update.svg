<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Update only the edges beside one merge</title><desc id="desc">Zoom into the first occurrence of a,n in Doc1. Remove indexed edges b,a; a,n; n,a. Reuse node n1 for an, unlink node n2, and reconnect prev/next pointers from n0 to n1 to n3. Add edges b,an and an,a. Global counts after this single replacement change from3 to2,5 to4,4 to3,0 to1,0 to1 respectively. The final two tokens of the document and other documents are untouched by this one operation. Subsequent occurrences must use their current neighbors, not stale original neighborhoods.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="12" y="35" class="" font-size="32">One occurrence: Doc1, n1 + n2 → an</text><text x="12" y="126" class="label" >Before</text><g data-node="0" data-token="98"><rect class="token violet" x="180" y="100" width="80" height="60" rx="7"/><text x="220" y="141" class="mono" font-size="34" text-anchor="middle">b</text><text x="220" y="187" class="mono muted" font-size="23" text-anchor="middle">n0</text></g><path class="edge" d="M264 125H301"/><path class="edge" d="M301 135H264"/><g data-node="1" data-token="97"><rect class="token teal selected" x="305" y="100" width="80" height="60" rx="7"/><text x="345" y="141" class="mono" font-size="34" text-anchor="middle">a</text><text x="345" y="187" class="mono muted" font-size="23" text-anchor="middle">n1</text></g><path class="edge" d="M389 125H426"/><path class="edge" d="M426 135H389"/><g data-node="2" data-token="110"><rect class="token amber selected" x="430" y="100" width="80" height="60" rx="7"/><text x="470" y="141" class="mono" font-size="34" text-anchor="middle">n</text><text x="470" y="187" class="mono muted" font-size="23" text-anchor="middle">n2</text></g><path class="edge" d="M514 125H551"/><path class="edge" d="M551 135H514"/><g data-node="3" data-token="97"><rect class="token teal" x="555" y="100" width="80" height="60" rx="7"/><text x="595" y="141" class="mono" font-size="34" text-anchor="middle">a</text><text x="595" y="187" class="mono muted" font-size="23" text-anchor="middle">n3</text></g><path class="edge" d="M639 125H676"/><path class="edge" d="M676 135H639"/><g data-node="4" data-token="110"><rect class="token amber" x="680" y="100" width="80" height="60" rx="7"/><text x="720" y="141" class="mono" font-size="34" text-anchor="middle">n</text><text x="720" y="187" class="mono muted" font-size="23" text-anchor="middle">n4</text></g><path class="edge" d="M764 125H801"/><path class="edge" d="M801 135H764"/><g data-node="5" data-token="97"><rect class="token teal" x="805" y="100" width="80" height="60" rx="7"/><text x="845" y="141" class="mono" font-size="34" text-anchor="middle">a</text><text x="845" y="187" class="mono muted" font-size="23" text-anchor="middle">n5</text></g><text x="180" y="231" class="mono" font-size="27">− (b,a)    − (a,n)    − (n,a)</text><text x="12" y="326" class="label" >After</text><g data-node="0" data-token="98"><rect class="token violet" x="180" y="300" width="80" height="60" rx="7"/><text x="220" y="341" class="mono" font-size="34" text-anchor="middle">b</text><text x="220" y="387" class="mono muted" font-size="23" text-anchor="middle">n0</text></g><path class="edge" d="M264 325H301"/><path class="edge" d="M301 335H264"/><g data-node="1" data-token="256"><rect class="token rose" x="305" y="300" width="80" height="60" rx="7"/><text x="345" y="341" class="mono" font-size="34" text-anchor="middle">an</text><text x="345" y="387" class="mono muted" font-size="23" text-anchor="middle">n1</text></g><path class="edge" d="M389 325H551"/><path class="edge" d="M551 335H389"/><g data-node="3" data-token="97"><rect class="token teal" x="555" y="300" width="80" height="60" rx="7"/><text x="595" y="341" class="mono" font-size="34" text-anchor="middle">a</text><text x="595" y="387" class="mono muted" font-size="23" text-anchor="middle">n3</text></g><path class="edge" d="M639 325H676"/><path class="edge" d="M676 335H639"/><g data-node="4" data-token="110"><rect class="token amber" x="680" y="300" width="80" height="60" rx="7"/><text x="720" y="341" class="mono" font-size="34" text-anchor="middle">n</text><text x="720" y="387" class="mono muted" font-size="23" text-anchor="middle">n4</text></g><path class="edge" d="M764 325H801"/><path class="edge" d="M801 335H764"/><g data-node="5" data-token="97"><rect class="token teal" x="805" y="300" width="80" height="60" rx="7"/><text x="845" y="341" class="mono" font-size="34" text-anchor="middle">a</text><text x="845" y="387" class="mono muted" font-size="23" text-anchor="middle">n5</text></g><text x="430" y="421" class="mono muted" font-size="23">n2 inactive</text><text x="180" y="477" class="mono accent" font-size="28">+ (b,an)    + (an,a)</text><text x="1010" y="79" class="label" >Count changes</text><g data-pair="98,97" data-delta="-1" data-before="3" data-after="2"><text x="1010" y="131" class="mono" font-size="26">b + a</text><text x="1010" y="161" class="mono accent" font-size="26">3 → 2</text></g><g data-pair="97,110" data-delta="-1" data-before="5" data-after="4"><text x="1010" y="196" class="mono" font-size="26">a + n</text><text x="1010" y="226" class="mono accent" font-size="26">5 → 4</text></g><g data-pair="110,97" data-delta="-1" data-before="4" data-after="3"><text x="1010" y="261" class="mono" font-size="26">n + a</text><text x="1010" y="291" class="mono accent" font-size="26">4 → 3</text></g><g data-pair="98,256" data-delta="1" data-before="0" data-after="1"><text x="1010" y="326" class="mono" font-size="26">b + an</text><text x="1010" y="356" class="mono accent" font-size="26">0 → 1</text></g><g data-pair="256,97" data-delta="1" data-before="0" data-after="1"><text x="1010" y="391" class="mono" font-size="26">an + a</text><text x="1010" y="421" class="mono accent" font-size="26">0 → 1</text></g><text x="180" y="540" class="muted" font-size="25">Remove 3 old edges; add 2 new edges. Everything else stays indexed.</text></svg>
