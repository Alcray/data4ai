<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Compare vocabulary sizes on the same held-out corpus</title><desc id="desc">Illustrative outcomes, not measurements. Fit32k,64k,128k-ID BPEs on the same100,000 documents, then encode identical unseen text excluded from fitting. Assumed totals50M,40M,38M give marginal reductions20%,5%. A64k vocabulary can be a better cost tradeoff, but sequence counts alone do not establish system cost or model quality.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="12" y="38" class="" font-size="33">Fit: same 100,000 documents</text><text x="12" y="162" class="label" >Vocabulary IDs</text><text x="440" y="162" class="label" >Held-out tokens</text><text x="875" y="162" class="label" >Fewer vs previous</text><path d="M12 185H1240" stroke="#111827" stroke-width="2"/><g data-vocabulary="32000" data-heldout-tokens="50000000" data-reduction="none"><text x="12" y="249" class="accent" font-size="39" font-weight="600">32,000</text><text x="440" y="249" class="" font-size="39">50M</text><text x="875" y="249" class="" font-size="36">—</text><path d="M12 276H1240" stroke="#e5e7eb"/></g><g data-vocabulary="64000" data-heldout-tokens="40000000" data-reduction="20"><text x="12" y="335" class="accent" font-size="39" font-weight="600">64,000</text><text x="440" y="335" class="" font-size="39">40M</text><text x="875" y="335" class="" font-size="36">20%</text><path d="M12 362H1240" stroke="#e5e7eb"/></g><g data-vocabulary="128000" data-heldout-tokens="38000000" data-reduction="5"><text x="12" y="421" class="accent" font-size="39" font-weight="600">128,000</text><text x="440" y="421" class="" font-size="39">38M</text><text x="875" y="421" class="" font-size="36">5%</text><path d="M12 448H1240" stroke="#e5e7eb"/></g><text x="12" y="529" class="accent" font-size="30" font-weight="600">64k may be enough: 2× vocabulary buys only 5% fewer tokens</text></svg>
