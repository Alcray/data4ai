<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Four connected data structures for BPE training</title><desc id="desc">A constructed training design uses doubly linked token nodes, a hash map of current pair frequencies, an inverted index from each pair to its occurrence node handles, and a max-heap of candidate frequency snapshots. The three documents are banana, banana, band. The figure shows Doc1 nodes n0 through n5; D1:n1 denotes the left node of the first a,n occurrence. The heap root is a,n with count5; lower nodes show selected candidates, with further entries omitted. This design is not a claim about the four publishers' undisclosed fitting pipelines.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="12" y="33" class="" font-size="30">Corpus: banana / banana / band</text><text x="12" y="91" class="accent" font-size="27" font-weight="600">Linked list</text><g data-node="0" data-token="98"><rect class="token violet" x="180" y="56" width="80" height="60" rx="7"/><text x="220" y="97" class="mono" font-size="34" text-anchor="middle">b</text><text x="220" y="143" class="mono muted" font-size="23" text-anchor="middle">n0</text></g><path class="edge" d="M264 81H301"/><path class="edge" d="M301 91H264"/><g data-node="1" data-token="97"><rect class="token teal" x="305" y="56" width="80" height="60" rx="7"/><text x="345" y="97" class="mono" font-size="34" text-anchor="middle">a</text><text x="345" y="143" class="mono muted" font-size="23" text-anchor="middle">n1</text></g><path class="edge" d="M389 81H426"/><path class="edge" d="M426 91H389"/><g data-node="2" data-token="110"><rect class="token amber" x="430" y="56" width="80" height="60" rx="7"/><text x="470" y="97" class="mono" font-size="34" text-anchor="middle">n</text><text x="470" y="143" class="mono muted" font-size="23" text-anchor="middle">n2</text></g><path class="edge" d="M514 81H551"/><path class="edge" d="M551 91H514"/><g data-node="3" data-token="97"><rect class="token teal" x="555" y="56" width="80" height="60" rx="7"/><text x="595" y="97" class="mono" font-size="34" text-anchor="middle">a</text><text x="595" y="143" class="mono muted" font-size="23" text-anchor="middle">n3</text></g><path class="edge" d="M639 81H676"/><path class="edge" d="M676 91H639"/><g data-node="4" data-token="110"><rect class="token amber" x="680" y="56" width="80" height="60" rx="7"/><text x="720" y="97" class="mono" font-size="34" text-anchor="middle">n</text><text x="720" y="143" class="mono muted" font-size="23" text-anchor="middle">n4</text></g><path class="edge" d="M764 81H801"/><path class="edge" d="M801 91H764"/><g data-node="5" data-token="97"><rect class="token teal" x="805" y="56" width="80" height="60" rx="7"/><text x="845" y="97" class="mono" font-size="34" text-anchor="middle">a</text><text x="845" y="143" class="mono muted" font-size="23" text-anchor="middle">n5</text></g><text x="12" y="133" class="muted" font-size="23">Doc 1</text><text x="12" y="209" class="accent" font-size="27" font-weight="600">Hash map: pair → count</text><text x="500" y="209" class="accent" font-size="27" font-weight="600">Inverted index: pair → occurrences</text><g data-pair="97,110" data-count="5"><text x="12" y="255" class="mono" font-size="27">a + n</text><text x="375" y="255" class="mono" font-size="28" text-anchor="end">5</text></g><text x="500" y="255" class="mono" font-size="26">a + n</text><text x="705" y="255" class="mono" font-size="20">D1:n1, D1:n3, D2:n1, D2:n3, D3:n1</text><g data-pair="110,97" data-count="4"><text x="12" y="299" class="mono" font-size="27">n + a</text><text x="375" y="299" class="mono" font-size="28" text-anchor="end">4</text></g><text x="500" y="299" class="mono" font-size="26">n + a</text><text x="705" y="299" class="mono" font-size="20">D1:n2, D1:n4, D2:n2, D2:n4</text><g data-pair="98,97" data-count="3"><text x="12" y="343" class="mono" font-size="27">b + a</text><text x="375" y="343" class="mono" font-size="28" text-anchor="end">3</text></g><text x="500" y="343" class="mono" font-size="26">b + a</text><text x="705" y="343" class="mono" font-size="20">D1:n0, D2:n0, D3:n0</text><g data-pair="110,100" data-count="1"><text x="12" y="387" class="mono" font-size="27">n + d</text><text x="375" y="387" class="mono" font-size="28" text-anchor="end">1</text></g><text x="500" y="387" class="mono" font-size="26">n + d</text><text x="705" y="387" class="mono" font-size="20">D3:n2</text><text x="12" y="485" class="accent" font-size="27" font-weight="600">Max-heap</text><text x="12" y="526" class="muted" font-size="24">Pop the maximum</text><path class="edge" d="M655 455L560 502"/><path class="edge" d="M705 455L805 502"/><rect class="token violet" x="580" y="412" width="200" height="46" rx="7"/><text x="680" y="444" class="mono" font-size="25" text-anchor="middle">a + n : 5</text><rect class="token violet" x="450" y="507" width="200" height="46" rx="7"/><text x="550" y="539" class="mono" font-size="25" text-anchor="middle">n + a : 4</text><rect class="token violet" x="730" y="507" width="200" height="46" rx="7"/><text x="830" y="539" class="mono" font-size="25" text-anchor="middle">b + a : 3</text><text x="980" y="541" class="muted" font-size="30">…</text></svg>
