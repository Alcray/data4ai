<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Byte BPE training: choose merge 2</title><desc id="desc">Constructed corpus banana, banana, band. Each document contributes one word-region after pre-tokenization; pairs never cross region or document boundaries. Current token IDs and all adjacent-pair counts are shown. Select b plus an, frequency 3, and replace its non-overlapping occurrences with ban, new ID 257. Counts were recomputed after the preceding merge, not copied from the original bytes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="12" y="38" class="" font-size="33">After merge 1: a + n → an (ID 256)</text><text x="12" y="83" class="muted" font-size="24">Each ASCII letter starts as one UTF-8 byte token.</text><g data-document="0" data-ids="98,256,256,97"><text x="12" y="170" class="label" >Doc 1</text><g data-piece="b" data-id="98"><rect class="token violet selected" x="130" y="135" width="68" height="56" rx="7"/><text x="164" y="173" class="mono" font-size="32" text-anchor="middle">b</text><text x="164" y="217" class="mono muted" font-size="20" text-anchor="middle">98</text></g><g data-piece="an" data-id="256"><rect class="token rose selected" x="208" y="135" width="84" height="56" rx="7"/><text x="250" y="173" class="mono" font-size="32" text-anchor="middle">an</text><text x="250" y="217" class="mono muted" font-size="20" text-anchor="middle">256</text></g><g data-piece="an" data-id="256"><rect class="token rose" x="302" y="135" width="84" height="56" rx="7"/><text x="344" y="173" class="mono" font-size="32" text-anchor="middle">an</text><text x="344" y="217" class="mono muted" font-size="20" text-anchor="middle">256</text></g><g data-piece="a" data-id="97"><rect class="token teal" x="396" y="135" width="68" height="56" rx="7"/><text x="430" y="173" class="mono" font-size="32" text-anchor="middle">a</text><text x="430" y="217" class="mono muted" font-size="20" text-anchor="middle">97</text></g></g><g data-document="1" data-ids="98,256,256,97"><text x="12" y="273" class="label" >Doc 2</text><g data-piece="b" data-id="98"><rect class="token violet selected" x="130" y="238" width="68" height="56" rx="7"/><text x="164" y="276" class="mono" font-size="32" text-anchor="middle">b</text><text x="164" y="320" class="mono muted" font-size="20" text-anchor="middle">98</text></g><g data-piece="an" data-id="256"><rect class="token rose selected" x="208" y="238" width="84" height="56" rx="7"/><text x="250" y="276" class="mono" font-size="32" text-anchor="middle">an</text><text x="250" y="320" class="mono muted" font-size="20" text-anchor="middle">256</text></g><g data-piece="an" data-id="256"><rect class="token rose" x="302" y="238" width="84" height="56" rx="7"/><text x="344" y="276" class="mono" font-size="32" text-anchor="middle">an</text><text x="344" y="320" class="mono muted" font-size="20" text-anchor="middle">256</text></g><g data-piece="a" data-id="97"><rect class="token teal" x="396" y="238" width="68" height="56" rx="7"/><text x="430" y="276" class="mono" font-size="32" text-anchor="middle">a</text><text x="430" y="320" class="mono muted" font-size="20" text-anchor="middle">97</text></g></g><g data-document="2" data-ids="98,256,100"><text x="12" y="376" class="label" >Doc 3</text><g data-piece="b" data-id="98"><rect class="token violet selected" x="130" y="341" width="68" height="56" rx="7"/><text x="164" y="379" class="mono" font-size="32" text-anchor="middle">b</text><text x="164" y="423" class="mono muted" font-size="20" text-anchor="middle">98</text></g><g data-piece="an" data-id="256"><rect class="token rose selected" x="208" y="341" width="84" height="56" rx="7"/><text x="250" y="379" class="mono" font-size="32" text-anchor="middle">an</text><text x="250" y="423" class="mono muted" font-size="20" text-anchor="middle">256</text></g><g data-piece="d" data-id="100"><rect class="token blue" x="302" y="341" width="68" height="56" rx="7"/><text x="336" y="379" class="mono" font-size="32" text-anchor="middle">d</text><text x="336" y="423" class="mono muted" font-size="20" text-anchor="middle">100</text></g></g><text x="900" y="98" class="label" >Adjacent pair counts</text><g data-pair="98,256" data-count="3"><rect x="885" y="118" width="360" height="48" rx="7" fill="#f2effe"/><text x="904" y="153" class="mono accent" font-size="29">b + an</text><text x="1210" y="153" class="mono accent" font-size="30" text-anchor="end">3</text></g><g data-pair="256,97" data-count="2"><text x="904" y="206" class="mono" font-size="29">an + a</text><text x="1210" y="206" class="mono" font-size="30" text-anchor="end">2</text></g><g data-pair="256,256" data-count="2"><text x="904" y="259" class="mono" font-size="29">an + an</text><text x="1210" y="259" class="mono" font-size="30" text-anchor="end">2</text></g><g data-pair="256,100" data-count="1"><text x="904" y="312" class="mono" font-size="29">an + d</text><text x="1210" y="312" class="mono" font-size="30" text-anchor="end">1</text></g><text x="130" y="493" class="accent" font-size="29" font-weight="600">Most frequent: b + an → ban · 3 replacements · new ID 257</text><text x="130" y="526" class="muted" font-size="23">Count pairs inside each pre-tokenized region.</text><text x="130" y="557" class="muted" font-size="23">Never across region or document boundaries.</text></svg>
