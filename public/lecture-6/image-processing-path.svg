<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Image preprocessing and vision encoding are separate</title><desc id="desc">A schematic Qwen image-enabled path, not a fixed patch count. Text with image-position markers is tokenized and embedded. RGB pixels pass through a compatible image processor, yielding pixel tensors and grid metadata, then a learned vision encoder produces visual feature vectors. Those vectors occupy the indicated image positions in the model input embedding sequence. The language model receives the combined representation. An image marker by itself contains no pixels. Kimi uses its own compatible processor and segment-aware message path.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="12" y="35" class="" font-size="32">Qwen example: two paths into one sequence</text><g data-stage="text-input"><rect x="12" y="95" width="230" height="90" rx="8" fill="#fff" stroke="#d6dae3" stroke-width="1.5"/><text x="127" y="133.5" class="" font-size="27" text-anchor="middle">Text + markers</text><text x="127" y="166.5" class="" font-size="27" text-anchor="middle">&lt;|image_pad|></text></g><g data-stage="text-embedding"><rect x="320" y="95" width="260" height="90" rx="8" fill="#fff" stroke="#d6dae3" stroke-width="1.5"/><text x="450" y="133.5" class="" font-size="27" text-anchor="middle">Text tokenizer</text><text x="450" y="166.5" class="" font-size="27" text-anchor="middle">ID → embedding</text></g><g data-stage="text-vectors"><rect x="655" y="95" width="240" height="90" rx="8" fill="#fff" stroke="#d6dae3" stroke-width="1.5"/><text x="775" y="150" class="" font-size="27" text-anchor="middle">Text vectors</text></g><g data-stage="image-input"><rect x="12" y="325" width="230" height="90" rx="8" fill="#fff" stroke="#d6dae3" stroke-width="1.5"/><text x="127" y="380" class="" font-size="27" text-anchor="middle">RGB image</text></g><g data-stage="image-preprocessing"><rect x="320" y="325" width="260" height="90" rx="8" fill="#fff" stroke="#d6dae3" stroke-width="1.5"/><text x="450" y="380" class="" font-size="27" text-anchor="middle">Image processor</text><text x="450" y="454" class="muted" font-size="23" text-anchor="middle">pixels + grid metadata</text></g><g data-stage="vision-encoder"><rect x="655" y="325" width="240" height="90" rx="8" fill="#fff" stroke="#d6dae3" stroke-width="1.5"/><text x="775" y="380" class="" font-size="27" text-anchor="middle">Vision encoder</text><text x="775" y="454" class="muted" font-size="23" text-anchor="middle">visual feature vectors</text></g><g data-stage="feature-insertion"><rect x="1020" y="205" width="240" height="100" rx="8" fill="#f2effe" stroke="#d6dae3" stroke-width="1.5"/><text x="1140" y="248.5" class="" font-size="27" text-anchor="middle">Fill image slots</text><text x="1140" y="281.5" class="" font-size="27" text-anchor="middle">with features</text></g><g data-stage="language-model"><rect x="1020" y="425" width="240" height="80" rx="8" fill="#fff" stroke="#d6dae3" stroke-width="1.5"/><text x="1140" y="458.5" class="" font-size="27" text-anchor="middle">Language</text><text x="1140" y="491.5" class="" font-size="27" text-anchor="middle">model</text></g><path class="edge" d="M246 140H310"/><path class="edge" d="M584 140H645"/><path class="edge" d="M899 140H955V230H1010"/><path class="edge" d="M246 370H310"/><path class="edge" d="M584 370H645"/><path class="edge" d="M899 370H955V280H1010"/><path class="edge" d="M1140 310V415"/><text x="12" y="544" class="accent" font-size="28" font-weight="600">The marker locates visual data; it does not contain the pixels.</text></svg>
