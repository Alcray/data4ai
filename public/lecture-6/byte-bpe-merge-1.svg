<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Byte BPE training: choose merge 1</title><desc id="desc">Constructed corpus banana, banana, band. Each document contributes one word-region after pre-tokenization; pairs never cross region or document boundaries. Current token IDs and all adjacent-pair counts are shown. Select a plus n, frequency 5, and replace its non-overlapping occurrences with an, new ID 256. Initial byte IDs: b 98, a 97, n 110, d 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><g data-document="0" data-ids="98,97,110,97,110,97"><text x="12" y="170" class="label" >Doc 1</text><g data-piece="b" data-id="98"><rect class="token violet" x="130" y="135" width="68" height="56" rx="7"/><text x="164" y="173" class="mono" font-size="32" text-anchor="middle">b</text><text x="164" y="217" class="mono muted" font-size="20" text-anchor="middle">98</text></g><g data-piece="a" data-id="97"><rect class="token teal selected" x="208" y="135" width="68" height="56" rx="7"/><text x="242" y="173" class="mono" font-size="32" text-anchor="middle">a</text><text x="242" y="217" class="mono muted" font-size="20" text-anchor="middle">97</text></g><g data-piece="n" data-id="110"><rect class="token amber selected" x="286" y="135" width="68" height="56" rx="7"/><text x="320" y="173" class="mono" font-size="32" text-anchor="middle">n</text><text x="320" y="217" class="mono muted" font-size="20" text-anchor="middle">110</text></g><g data-piece="a" data-id="97"><rect class="token teal selected" x="364" y="135" width="68" height="56" rx="7"/><text x="398" y="173" class="mono" font-size="32" text-anchor="middle">a</text><text x="398" y="217" class="mono muted" font-size="20" text-anchor="middle">97</text></g><g data-piece="n" data-id="110"><rect class="token amber selected" x="442" y="135" width="68" height="56" rx="7"/><text x="476" y="173" class="mono" font-size="32" text-anchor="middle">n</text><text x="476" y="217" class="mono muted" font-size="20" text-anchor="middle">110</text></g><g data-piece="a" data-id="97"><rect class="token teal" x="520" y="135" width="68" height="56" rx="7"/><text x="554" y="173" class="mono" font-size="32" text-anchor="middle">a</text><text x="554" y="217" class="mono muted" font-size="20" text-anchor="middle">97</text></g></g><g data-document="1" data-ids="98,97,110,97,110,97"><text x="12" y="273" class="label" >Doc 2</text><g data-piece="b" data-id="98"><rect class="token violet" x="130" y="238" width="68" height="56" rx="7"/><text x="164" y="276" class="mono" font-size="32" text-anchor="middle">b</text><text x="164" y="320" class="mono muted" font-size="20" text-anchor="middle">98</text></g><g data-piece="a" data-id="97"><rect class="token teal selected" x="208" y="238" width="68" height="56" rx="7"/><text x="242" y="276" class="mono" font-size="32" text-anchor="middle">a</text><text x="242" y="320" class="mono muted" font-size="20" text-anchor="middle">97</text></g><g data-piece="n" data-id="110"><rect class="token amber selected" x="286" y="238" width="68" height="56" rx="7"/><text x="320" y="276" class="mono" font-size="32" text-anchor="middle">n</text><text x="320" y="320" class="mono muted" font-size="20" text-anchor="middle">110</text></g><g data-piece="a" data-id="97"><rect class="token teal selected" x="364" y="238" width="68" height="56" rx="7"/><text x="398" y="276" class="mono" font-size="32" text-anchor="middle">a</text><text x="398" y="320" class="mono muted" font-size="20" text-anchor="middle">97</text></g><g data-piece="n" data-id="110"><rect class="token amber selected" x="442" y="238" width="68" height="56" rx="7"/><text x="476" y="276" class="mono" font-size="32" text-anchor="middle">n</text><text x="476" y="320" class="mono muted" font-size="20" text-anchor="middle">110</text></g><g data-piece="a" data-id="97"><rect class="token teal" x="520" y="238" width="68" height="56" rx="7"/><text x="554" y="276" class="mono" font-size="32" text-anchor="middle">a</text><text x="554" y="320" class="mono muted" font-size="20" text-anchor="middle">97</text></g></g><g data-document="2" data-ids="98,97,110,100"><text x="12" y="376" class="label" >Doc 3</text><g data-piece="b" data-id="98"><rect class="token violet" x="130" y="341" width="68" height="56" rx="7"/><text x="164" y="379" class="mono" font-size="32" text-anchor="middle">b</text><text x="164" y="423" class="mono muted" font-size="20" text-anchor="middle">98</text></g><g data-piece="a" data-id="97"><rect class="token teal selected" x="208" y="341" width="68" height="56" rx="7"/><text x="242" y="379" class="mono" font-size="32" text-anchor="middle">a</text><text x="242" y="423" class="mono muted" font-size="20" text-anchor="middle">97</text></g><g data-piece="n" data-id="110"><rect class="token amber selected" x="286" y="341" width="68" height="56" rx="7"/><text x="320" y="379" class="mono" font-size="32" text-anchor="middle">n</text><text x="320" y="423" class="mono muted" font-size="20" text-anchor="middle">110</text></g><g data-piece="d" data-id="100"><rect class="token blue" x="364" y="341" width="68" height="56" rx="7"/><text x="398" y="379" class="mono" font-size="32" text-anchor="middle">d</text><text x="398" y="423" class="mono muted" font-size="20" text-anchor="middle">100</text></g></g><text x="900" y="98" class="label" >Adjacent pair counts</text><g data-pair="97,110" data-count="5"><rect x="885" y="118" width="360" height="48" rx="7" fill="#f2effe"/><text x="904" y="153" class="mono accent" font-size="29">a + n</text><text x="1210" y="153" class="mono accent" font-size="30" text-anchor="end">5</text></g><g data-pair="110,97" data-count="4"><text x="904" y="206" class="mono" font-size="29">n + a</text><text x="1210" y="206" class="mono" font-size="30" text-anchor="end">4</text></g><g data-pair="98,97" data-count="3"><text x="904" y="259" class="mono" font-size="29">b + a</text><text x="1210" y="259" class="mono" font-size="30" text-anchor="end">3</text></g><g data-pair="110,100" data-count="1"><text x="904" y="312" class="mono" font-size="29">n + d</text><text x="1210" y="312" class="mono" font-size="30" text-anchor="end">1</text></g><text x="130" y="493" class="accent" font-size="29" font-weight="600">Most frequent: a + n → an · 5 replacements · new ID 256</text><text x="130" y="526" class="muted" font-size="23">Count pairs inside each pre-tokenized region.</text><text x="130" y="557" class="muted" font-size="23">Never across region or document boundaries.</text></svg>
