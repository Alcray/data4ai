<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Refresh changed priorities and skip stale heap entries</title><desc id="desc">After all five a,n replacements, live counts are b,an3; an,a2; an,an2; an,d1. Push refreshed candidates for changed pairs; do not rebuild the whole heap. In this deterministic trace, stale old n,a4 and b,a3 entries are popped and rejected before the valid b,an3 candidate. Snapshot versions are checked against the current map. Occurrence handles must also be checked for live, adjacent nodes before merging. Stale entries consume memory, so production implementations may periodically compact the heap.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="12" y="38" class="" font-size="32">After all five a + n replacements</text><text x="12" y="104" class="accent" font-size="28" font-weight="600">Live hash-map counts</text><text x="12" y="173" class="mono" font-size="33">b + an</text><text x="385" y="173" class="mono accent" font-size="34" text-anchor="end">3</text><text x="12" y="250" class="mono" font-size="33">an + a</text><text x="385" y="250" class="mono accent" font-size="34" text-anchor="end">2</text><text x="12" y="327" class="mono" font-size="33">an + an</text><text x="385" y="327" class="mono accent" font-size="34" text-anchor="end">2</text><text x="12" y="404" class="mono" font-size="33">an + d</text><text x="385" y="404" class="mono accent" font-size="34" text-anchor="end">1</text><text x="620" y="104" class="accent" font-size="28" font-weight="600">Max-heap: validate each pop</text><g data-pop="0" data-pair="110,97" data-count="4" data-valid="false"><rect class="token slate" x="620" y="137" width="330" height="69" rx="7"/><text x="642" y="181" class="mono" font-size="30">n + a : 4</text><text x="988" y="180" class="muted" font-size="27">stale → skip</text></g><g data-pop="1" data-pair="98,97" data-count="3" data-valid="false"><rect class="token slate" x="620" y="242" width="330" height="69" rx="7"/><text x="642" y="286" class="mono" font-size="30">b + a : 3</text><text x="988" y="285" class="muted" font-size="27">stale → skip</text></g><g data-pop="2" data-pair="98,256" data-count="3" data-valid="true"><rect class="token violet selected" x="620" y="347" width="330" height="69" rx="7"/><text x="642" y="391" class="mono" font-size="30">b + an : 3</text><text x="988" y="390" class="accent" font-size="27">select</text></g><text x="12" y="496" class="accent" font-size="29" font-weight="600">Push refreshed priorities only for changed pairs.</text><text x="12" y="542" class="muted" font-size="25">Check versions on pop; re-check live, adjacent nodes before replacement.</text></svg>
