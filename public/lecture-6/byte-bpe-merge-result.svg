<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Byte BPE training: the two learned merges</title><desc id="desc">After merging a plus n five times and b plus an three times, the two banana documents are ban, an, a; band is ban, d. Stop at a two-merge teaching budget. Learned rules in order are (97,110) to 256, then (98,256) to 257. Training recomputes frequency counts; encoding replays the learned priorities instead of retraining on each input.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="12" y="38" class="" font-size="33">After merge 2: b + an → ban (ID 257)</text><text x="12" y="83" class="muted" font-size="24">Stop after two merges: a deliberately small teaching budget.</text><g data-document="0" data-ids="257,256,97"><text x="12" y="170" class="label" >Doc 1</text><g data-piece="ban" data-id="257"><rect class="token slate" x="130" y="135" width="112" height="56" rx="7"/><text x="186" y="173" class="mono" font-size="32" text-anchor="middle">ban</text><text x="186" y="217" class="mono muted" font-size="20" text-anchor="middle">257</text></g><g data-piece="an" data-id="256"><rect class="token rose" x="252" y="135" width="84" height="56" rx="7"/><text x="294" y="173" class="mono" font-size="32" text-anchor="middle">an</text><text x="294" y="217" class="mono muted" font-size="20" text-anchor="middle">256</text></g><g data-piece="a" data-id="97"><rect class="token teal" x="346" y="135" width="68" height="56" rx="7"/><text x="380" y="173" class="mono" font-size="32" text-anchor="middle">a</text><text x="380" y="217" class="mono muted" font-size="20" text-anchor="middle">97</text></g></g><g data-document="1" data-ids="257,256,97"><text x="12" y="273" class="label" >Doc 2</text><g data-piece="ban" data-id="257"><rect class="token slate" x="130" y="238" width="112" height="56" rx="7"/><text x="186" y="276" class="mono" font-size="32" text-anchor="middle">ban</text><text x="186" y="320" class="mono muted" font-size="20" text-anchor="middle">257</text></g><g data-piece="an" data-id="256"><rect class="token rose" x="252" y="238" width="84" height="56" rx="7"/><text x="294" y="276" class="mono" font-size="32" text-anchor="middle">an</text><text x="294" y="320" class="mono muted" font-size="20" text-anchor="middle">256</text></g><g data-piece="a" data-id="97"><rect class="token teal" x="346" y="238" width="68" height="56" rx="7"/><text x="380" y="276" class="mono" font-size="32" text-anchor="middle">a</text><text x="380" y="320" class="mono muted" font-size="20" text-anchor="middle">97</text></g></g><g data-document="2" data-ids="257,100"><text x="12" y="376" class="label" >Doc 3</text><g data-piece="ban" data-id="257"><rect class="token slate" x="130" y="341" width="112" height="56" rx="7"/><text x="186" y="379" class="mono" font-size="32" text-anchor="middle">ban</text><text x="186" y="423" class="mono muted" font-size="20" text-anchor="middle">257</text></g><g data-piece="d" data-id="100"><rect class="token blue" x="252" y="341" width="68" height="56" rx="7"/><text x="286" y="379" class="mono" font-size="32" text-anchor="middle">d</text><text x="286" y="423" class="mono muted" font-size="20" text-anchor="middle">100</text></g></g><text x="900" y="98" class="label" >Learned merge order</text><g data-merge-rank="0" data-pair="97,110" data-new-id="256"><text x="900" y="166" class="mono accent" font-size="30">1. a + n</text><text x="938" y="204" class="mono" font-size="28">→ an (ID 256)</text></g><g data-merge-rank="1" data-pair="98,256" data-new-id="257"><text x="900" y="270" class="mono accent" font-size="30">2. b + an</text><text x="938" y="308" class="mono" font-size="28">→ ban (ID 257)</text></g><text x="130" y="493" class="accent" font-size="31" font-weight="600">Training: recount → choose → merge → repeat</text><text x="130" y="543" class="muted" font-size="24">Encoding new text: replay learned merge priorities, not new frequency counts.</text></svg>
