<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Added token IDs and embedding capacity are different</title><desc id="desc">Pinned Qwen3.8 has 248044 BPE entries plus 33 added entries, yielding 248077 loaded IDs. Examples include im-start, im-end, think and closing-think with the exact IDs shown. The configuration allocates 248320 rows, 243 more than the tokenizer can name. Bands are not to scale; symbolic cells are not checkpoint values. Extra rows are numeric vectors, not empty cells; this inspection does not establish that their values are zero, random, or unchanged by training.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="12" y="44" class="accent" font-size="37" font-weight="600">248,044 + 33 = 248,077</text><text x="12" y="88" class="muted" font-size="26">BPE + added entries = loaded IDs</text><text x="12" y="154" class="label" >Added IDs (examples)</text><g data-added-token="&lt;|im_start|>" data-id="248045"><text x="12" y="208" class="mono" font-size="30">&lt;|im_start|></text><text x="425" y="208" class="mono accent" font-size="29" text-anchor="end">248045</text></g><g data-added-token="&lt;|im_end|>" data-id="248046"><text x="12" y="267" class="mono" font-size="30">&lt;|im_end|></text><text x="425" y="267" class="mono accent" font-size="29" text-anchor="end">248046</text></g><g data-added-token="&lt;think>" data-id="248068"><text x="12" y="326" class="mono" font-size="30">&lt;think></text><text x="425" y="326" class="mono accent" font-size="29" text-anchor="end">248068</text></g><g data-added-token="&lt;/think>" data-id="248069"><text x="12" y="385" class="mono" font-size="30">&lt;/think></text><text x="425" y="385" class="mono accent" font-size="29" text-anchor="end">248069</text></g><text x="650" y="44" class="" font-size="34" font-weight="600">248,320 embedding rows</text><text x="650" y="88" class="muted" font-size="25">Configured capacity · schematic</text><rect class="token slate" x="650" y="135" width="590" height="105" rx="7"/><text x="672" y="172" class="" font-size="28">BPE IDs</text><text x="672" y="212" class="mono" font-size="25">0 … 248043</text><path d="M1050 147V228" stroke="#cbd0d9"/><text x="1072" y="196" class="mono muted" font-size="21" text-anchor="middle">w₁</text><path d="M1095 147V228" stroke="#cbd0d9"/><text x="1117" y="196" class="mono muted" font-size="21" text-anchor="middle">w₂</text><path d="M1140 147V228" stroke="#cbd0d9"/><text x="1162" y="196" class="mono muted" font-size="21" text-anchor="middle">…</text><path d="M1185 147V228" stroke="#cbd0d9"/><text x="1207" y="196" class="mono muted" font-size="21" text-anchor="middle">w_d</text><rect class="token violet" x="650" y="240" width="590" height="105" rx="7"/><text x="672" y="277" class="" font-size="28">Added IDs</text><text x="672" y="317" class="mono" font-size="25">248044 … 248076</text><path d="M1050 252V333" stroke="#cbd0d9"/><text x="1072" y="301" class="mono muted" font-size="21" text-anchor="middle">w₁</text><path d="M1095 252V333" stroke="#cbd0d9"/><text x="1117" y="301" class="mono muted" font-size="21" text-anchor="middle">w₂</text><path d="M1140 252V333" stroke="#cbd0d9"/><text x="1162" y="301" class="mono muted" font-size="21" text-anchor="middle">…</text><path d="M1185 252V333" stroke="#cbd0d9"/><text x="1207" y="301" class="mono muted" font-size="21" text-anchor="middle">w_d</text><rect class="token slate" x="650" y="345" width="590" height="105" rx="7"/><text x="672" y="382" class="" font-size="28">243 additional rows</text><text x="672" y="422" class="mono" font-size="25">248077 … 248319</text><path d="M1050 357V438" stroke="#cbd0d9"/><text x="1072" y="406" class="mono muted" font-size="21" text-anchor="middle">w₁</text><path d="M1095 357V438" stroke="#cbd0d9"/><text x="1117" y="406" class="mono muted" font-size="21" text-anchor="middle">w₂</text><path d="M1140 357V438" stroke="#cbd0d9"/><text x="1162" y="406" class="mono muted" font-size="21" text-anchor="middle">…</text><path d="M1185 357V438" stroke="#cbd0d9"/><text x="1207" y="406" class="mono muted" font-size="21" text-anchor="middle">w_d</text></svg>
