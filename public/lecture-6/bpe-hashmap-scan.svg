<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Build the pair-count hash map one window at a time</title><desc id="desc">In a fresh byte-BPE run, scan Doc1 abab: a,b gets count1, b,a gets count1, then a,b becomes2. Doc2 abac contributes a,b, b,a, a,c. Final counts are a,b3; b,a2; a,c1. Each highlighted adjacent window contributes one map increment. Count within documents, never across their boundary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="12" y="35" class="" font-size="32">Doc 1: abab</text><text x="730" y="35" class="label" >Hash map after each step</text><g data-scan-node="0" data-pair="97,98" data-count="1"><text x="12" y="115" class="accent" font-size="33">1</text><g data-node="0" data-token="97"><rect class="token teal selected" x="95" y="75" width="90" height="58" rx="7"/><text x="140" y="115" class="mono" font-size="35" text-anchor="middle">a</text><text x="140" y="162" class="mono muted" font-size="22" text-anchor="middle">n0</text></g><g data-node="1" data-token="98"><rect class="token violet selected" x="220" y="75" width="90" height="58" rx="7"/><text x="265" y="115" class="mono" font-size="35" text-anchor="middle">b</text><text x="265" y="162" class="mono muted" font-size="22" text-anchor="middle">n1</text></g><g data-node="2" data-token="97"><rect class="token teal" x="345" y="75" width="90" height="58" rx="7"/><text x="390" y="115" class="mono" font-size="35" text-anchor="middle">a</text><text x="390" y="162" class="mono muted" font-size="22" text-anchor="middle">n2</text></g><g data-node="3" data-token="98"><rect class="token violet" x="470" y="75" width="90" height="58" rx="7"/><text x="515" y="115" class="mono" font-size="35" text-anchor="middle">b</text><text x="515" y="162" class="mono muted" font-size="22" text-anchor="middle">n3</text></g><path class="edge" d="M605 104H680"/><text x="730" y="113" class="mono" font-size="29">(a,b): 1</text></g><g data-scan-node="1" data-pair="98,97" data-count="1"><text x="12" y="238" class="accent" font-size="33">2</text><g data-node="0" data-token="97"><rect class="token teal" x="95" y="198" width="90" height="58" rx="7"/><text x="140" y="238" class="mono" font-size="35" text-anchor="middle">a</text><text x="140" y="285" class="mono muted" font-size="22" text-anchor="middle">n0</text></g><g data-node="1" data-token="98"><rect class="token violet selected" x="220" y="198" width="90" height="58" rx="7"/><text x="265" y="238" class="mono" font-size="35" text-anchor="middle">b</text><text x="265" y="285" class="mono muted" font-size="22" text-anchor="middle">n1</text></g><g data-node="2" data-token="97"><rect class="token teal selected" x="345" y="198" width="90" height="58" rx="7"/><text x="390" y="238" class="mono" font-size="35" text-anchor="middle">a</text><text x="390" y="285" class="mono muted" font-size="22" text-anchor="middle">n2</text></g><g data-node="3" data-token="98"><rect class="token violet" x="470" y="198" width="90" height="58" rx="7"/><text x="515" y="238" class="mono" font-size="35" text-anchor="middle">b</text><text x="515" y="285" class="mono muted" font-size="22" text-anchor="middle">n3</text></g><path class="edge" d="M605 227H680"/><text x="730" y="236" class="mono" font-size="29">(a,b): 1   (b,a): 1</text></g><g data-scan-node="2" data-pair="97,98" data-count="2"><text x="12" y="361" class="accent" font-size="33">3</text><g data-node="0" data-token="97"><rect class="token teal" x="95" y="321" width="90" height="58" rx="7"/><text x="140" y="361" class="mono" font-size="35" text-anchor="middle">a</text><text x="140" y="408" class="mono muted" font-size="22" text-anchor="middle">n0</text></g><g data-node="1" data-token="98"><rect class="token violet" x="220" y="321" width="90" height="58" rx="7"/><text x="265" y="361" class="mono" font-size="35" text-anchor="middle">b</text><text x="265" y="408" class="mono muted" font-size="22" text-anchor="middle">n1</text></g><g data-node="2" data-token="97"><rect class="token teal selected" x="345" y="321" width="90" height="58" rx="7"/><text x="390" y="361" class="mono" font-size="35" text-anchor="middle">a</text><text x="390" y="408" class="mono muted" font-size="22" text-anchor="middle">n2</text></g><g data-node="3" data-token="98"><rect class="token violet selected" x="470" y="321" width="90" height="58" rx="7"/><text x="515" y="361" class="mono" font-size="35" text-anchor="middle">b</text><text x="515" y="408" class="mono muted" font-size="22" text-anchor="middle">n3</text></g><path class="edge" d="M605 350H680"/><text x="730" y="359" class="mono" font-size="29">(a,b): 2   (b,a): 1</text></g><text x="12" y="493" class="" font-size="31">Continue with Doc 2: abac</text><text x="12" y="544" class="mono accent" font-size="34">(a,b): 3     (b,a): 2     (a,c): 1</text></svg>
