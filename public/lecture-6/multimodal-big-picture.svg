<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Big picture: images become embeddings</title><desc id="desc">Common image–text encoder–projector pattern, not a universal architecture. An illustrative image is resized and patchified, a vision encoder and projector produce visual embeddings, and a separate prompt passes through a tokenizer and embedding lookup. Text and visual vectors join an ordered sequence consumed by the language model. The model can respond conditioned on the image and prompt without an intermediate image caption. Shaded columns represent numerical vectors, not measured values, fixed token counts or semantic labels.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><g data-stage="image-input"><text x="120" y="38" class="" font-size="29" text-anchor="middle">Image pixels</text><rect x="20" y="66" width="200" height="132" rx="7" fill="#f6f7f9" stroke="#d6dae3"/><circle cx="169" cy="98" r="18" fill="#7253ed" opacity=".5"/><path d="M21 180L77 114L125 160L153 133L219 197H21Z" fill="#cbd5e1"/><path d="M21 180L77 114L125 160L153 133L219 197" fill="none" stroke="#64748b" stroke-width="2"/><path d="M70 66V198M120 66V198M170 66V198M20 110H220M20 154H220" fill="none" stroke="#fff" stroke-width="2"/><text x="120" y="236" class="muted" font-size="23" text-anchor="middle">Resize / patchify</text></g><g data-stage="vision-encoding"><rect x="285" y="80" width="250" height="105" rx="8" fill="#fff" stroke="#d6dae3" stroke-width="1.5"/><text x="410" y="126" class="" font-size="27" text-anchor="middle">Vision encoder</text><text x="410" y="159" class="" font-size="27" text-anchor="middle">+ projector</text></g><g data-stage="visual-embeddings"><text x="710" y="38" class="accent" font-size="28" text-anchor="middle">Visual embeddings</text><g data-vector="visual"><rect x="635" y="85" width="31" height="12" rx="2" fill="#7253ed" opacity="0.22"/><rect x="635" y="100" width="31" height="12" rx="2" fill="#7253ed" opacity="0.5"/><rect x="635" y="115" width="31" height="12" rx="2" fill="#7253ed" opacity="0.75"/><rect x="635" y="130" width="31" height="12" rx="2" fill="#7253ed" opacity="0.35"/><rect x="635" y="145" width="31" height="12" rx="2" fill="#7253ed" opacity="0.65"/><rect x="635" y="160" width="31" height="12" rx="2" fill="#7253ed" opacity="0.9"/></g><g data-vector="visual"><rect x="675" y="85" width="31" height="12" rx="2" fill="#7253ed" opacity="0.5"/><rect x="675" y="100" width="31" height="12" rx="2" fill="#7253ed" opacity="0.75"/><rect x="675" y="115" width="31" height="12" rx="2" fill="#7253ed" opacity="0.35"/><rect x="675" y="130" width="31" height="12" rx="2" fill="#7253ed" opacity="0.65"/><rect x="675" y="145" width="31" height="12" rx="2" fill="#7253ed" opacity="0.9"/><rect x="675" y="160" width="31" height="12" rx="2" fill="#7253ed" opacity="0.22"/></g><g data-vector="visual"><rect x="715" y="85" width="31" height="12" rx="2" fill="#7253ed" opacity="0.75"/><rect x="715" y="100" width="31" height="12" rx="2" fill="#7253ed" opacity="0.35"/><rect x="715" y="115" width="31" height="12" rx="2" fill="#7253ed" opacity="0.65"/><rect x="715" y="130" width="31" height="12" rx="2" fill="#7253ed" opacity="0.9"/><rect x="715" y="145" width="31" height="12" rx="2" fill="#7253ed" opacity="0.22"/><rect x="715" y="160" width="31" height="12" rx="2" fill="#7253ed" opacity="0.5"/></g><g data-vector="visual"><rect x="755" y="85" width="31" height="12" rx="2" fill="#7253ed" opacity="0.35"/><rect x="755" y="100" width="31" height="12" rx="2" fill="#7253ed" opacity="0.65"/><rect x="755" y="115" width="31" height="12" rx="2" fill="#7253ed" opacity="0.9"/><rect x="755" y="130" width="31" height="12" rx="2" fill="#7253ed" opacity="0.22"/><rect x="755" y="145" width="31" height="12" rx="2" fill="#7253ed" opacity="0.5"/><rect x="755" y="160" width="31" height="12" rx="2" fill="#7253ed" opacity="0.75"/></g></g><g data-stage="text-input"><rect x="20" y="335" width="200" height="100" rx="8" fill="#fff" stroke="#d6dae3" stroke-width="1.5"/><text x="120" y="378.5" class="" font-size="27" text-anchor="middle">Describe this</text><text x="120" y="411.5" class="" font-size="27" text-anchor="middle">picture.</text><text x="120" y="475" class="muted" font-size="25" text-anchor="middle">Text prompt</text></g><g data-stage="text-embedding"><rect x="285" y="335" width="250" height="100" rx="8" fill="#fff" stroke="#d6dae3" stroke-width="1.5"/><text x="410" y="378.5" class="" font-size="27" text-anchor="middle">Tokenizer +</text><text x="410" y="411.5" class="" font-size="27" text-anchor="middle">embedding table</text></g><g data-stage="text-embeddings"><text x="710" y="310" class="" font-size="28" text-anchor="middle">Text embeddings</text><g data-vector="text"><rect x="655" y="345" width="31" height="12" rx="2" fill="#64748b" opacity="0.22"/><rect x="655" y="360" width="31" height="12" rx="2" fill="#64748b" opacity="0.5"/><rect x="655" y="375" width="31" height="12" rx="2" fill="#64748b" opacity="0.75"/><rect x="655" y="390" width="31" height="12" rx="2" fill="#64748b" opacity="0.35"/><rect x="655" y="405" width="31" height="12" rx="2" fill="#64748b" opacity="0.65"/><rect x="655" y="420" width="31" height="12" rx="2" fill="#64748b" opacity="0.9"/></g><g data-vector="text"><rect x="695" y="345" width="31" 