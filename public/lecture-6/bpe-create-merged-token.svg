<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Choose the most frequent pair and allocate ID256</title><desc id="desc">The count map selects a,b with frequency3. Base IDs97 and98 concatenate into a new byte string ab, allocated ID256 in this fresh training run. The learned rule is (97,98) to256, not arithmetic addition of the two IDs. An inverted-index lookup supplies D1:n0,D1:n2,D2:n0. No text search is needed to locate these candidates.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="12" y="38" class="label" >Current pair counts</text><text x="595" y="38" class="label" >New vocabulary entry</text><g data-pair="97,98" data-count="3"><rect x="0" y="76" width="395" height="74" rx="7" fill="#f2effe"/><text x="12" y="124" class="mono" font-size="38">(a,b)</text><text x="355" y="124" class="mono accent" font-size="42" text-anchor="end">3</text></g><g data-pair="98,97" data-count="2"><text x="12" y="220" class="mono" font-size="38">(b,a)</text><text x="355" y="220" class="mono" font-size="42" text-anchor="end">2</text></g><g data-pair="97,99" data-count="1"><text x="12" y="316" class="mono" font-size="38">(a,c)</text><text x="355" y="316" class="mono" font-size="42" text-anchor="end">1</text></g><g data-merge-pair="97,98" data-new-id="256"><text x="595" y="129" class="mono accent" font-size="46">(97,98) → 256</text><rect class="token teal" x="595" y="202" width="115" height="80" rx="8"/><text x="652.5" y="256" class="mono" font-size="42" text-anchor="middle">a</text><text x="652.5" y="325" class="mono muted" font-size="29" text-anchor="middle">97</text><rect class="token violet" x="755" y="202" width="115" height="80" rx="8"/><text x="812.5" y="256" class="mono" font-size="42" text-anchor="middle">b</text><text x="812.5" y="325" class="mono muted" font-size="29" text-anchor="middle">98</text><rect class="token rose" x="1055" y="202" width="115" height="80" rx="8"/><text x="1112.5" y="256" class="mono" font-size="42" text-anchor="middle">ab</text><text x="1112.5" y="325" class="mono muted" font-size="29" text-anchor="middle">256</text><text x="732" y="254" class="accent" font-size="38" text-anchor="middle">+</text><path class="edge" d="M907 243H1015"/></g><text x="12" y="439" class="label" >Look up the chosen pair's locations</text><text x="12" y="505" class="mono" font-size="31">index[(97,98)] → [D1:n0, D1:n2, D2:n0]</text></svg>
