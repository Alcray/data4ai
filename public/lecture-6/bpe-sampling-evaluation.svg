<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 575" role="img" aria-labelledby="title desc"><title id="title">Illustrative token counts on identical held-out texts</title><desc id="desc">These are assigned teaching outcomes, not measurements from fitting10GB samples. Each row uses identical evaluation text for A and B and100,000 reference units. English words:130,000 versus138,000 model tokens,1.30 versus1.38 per word. Spanish words:180,000 versus145,000,1.80 versus1.45. Python reference lexemes:165,000 versus140,000,1.65 versus1.40. B increases English count6.2%, reduces Spanish19.4%, reduces code15.2%. Byte proportions cannot be used directly as weights for per-word rates.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="12" y="38" class="" font-size="33">Same unseen text for A and B</text><text x="12" y="86" class="muted" font-size="27">Illustrative counts · Prose words / code lexemes</text><text x="12" y="162" class="label" >Slice</text><text x="290" y="162" class="label" >Reference units</text><text x="650" y="162" class="label" >A: 64k BPE</text><text x="960" y="162" class="label" >B: 64k BPE</text><path d="M12 185H1240" stroke="#111827" stroke-width="2"/><g data-slice="English" data-units="100000" data-unit="word" data-tokens-a="130000" data-tokens-b="138000" data-ratio-a="1.3" data-ratio-b="1.38"><text x="12" y="245" class="accent" font-size="33" font-weight="600">English</text><text x="290" y="245" class="" font-size="29">100k words</text><text x="650" y="245" class="" font-size="34">130,000</text><text x="960" y="245" class="" font-size="34">138,000</text><text x="650" y="281" class="muted" font-size="26">1.30 / word</text><text x="960" y="281" class="muted" font-size="26">1.38 / word</text><path d="M12 299H1240" stroke="#e5e7eb"/></g><g data-slice="Spanish" data-units="100000" data-unit="word" data-tokens-a="180000" data-tokens-b="145000" data-ratio-a="1.8" data-ratio-b="1.45"><text x="12" y="345" class="accent" font-size="33" font-weight="600">Spanish</text><text x="290" y="345" class="" font-size="29">100k words</text><text x="650" y="345" class="" font-size="34">180,000</text><text x="960" y="345" class="" font-size="34">145,000</text><text x="650" y="381" class="muted" font-size="26">1.80 / word</text><text x="960" y="381" class="muted" font-size="26">1.45 / word</text><path d="M12 399H1240" stroke="#e5e7eb"/></g><g data-slice="Code" data-units="100000" data-unit="lexeme" data-tokens-a="165000" data-tokens-b="140000" data-ratio-a="1.65" data-ratio-b="1.4"><text x="12" y="445" class="accent" font-size="33" font-weight="600">Code</text><text x="290" y="445" class="" font-size="29">100k lexemes</text><text x="650" y="445" class="" font-size="34">165,000</text><text x="960" y="445" class="" font-size="34">140,000</text><text x="650" y="481" class="muted" font-size="26">1.65 / lexeme</text><text x="960" y="481" class="muted" font-size="26">1.40 / lexeme</text><path d="M12 499H1240" stroke="#e5e7eb"/></g><text x="12" y="549" class="accent" font-size="27" font-weight="600">B vs A: English +6.2% · Spanish −19.4% · Code −15.2%</text></svg>
