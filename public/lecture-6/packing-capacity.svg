<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Fill a4096-position block with512-position documents</title><desc id="desc">Constructed utilization example: each prepared document supplies512 valid inputs and aligned next-token targets, with boundary markers accounted for. One document uses512 real positions plus3584 padding,12.5percent utilization. Two use1024 real plus3072 padding,25percent. Eight fill4096 positions,100percent. Sequence length counts positions per block; batch size counts blocks. These are slot counts, not measured runtime speedups.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="20" y="42" class="" font-size="33">512 valid inputs per document</text><g data-documents="1" data-inputs="512" data-padding="3584" data-utilization="0.125"><text x="20" y="143" class="" font-size="29">1 document</text><rect x="280" y="100" width="98" height="65" rx="5" fill="#f2effe" stroke="#b6a4f2"/><text x="329" y="143" class="accent" font-size="29" text-anchor="middle">A</text><rect x="384" y="100" width="98" height="65" rx="5" fill="#f6f7f9" stroke="#e5e7eb"/><text x="433" y="143" class="muted" font-size="29" text-anchor="middle">—</text><rect x="488" y="100" width="98" height="65" rx="5" fill="#f6f7f9" stroke="#e5e7eb"/><text x="537" y="143" c