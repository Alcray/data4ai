<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc"><title id="title">Two fitting samples from a100GB English Spanish code pool</title><desc id="desc">A separate controlled example: the eligible fitting pool has80GB English,15GB Spanish,5GB code after evaluation texts are reserved. A10GB sample A contains8GB,1.5GB,0.5GB. Sample B contains5GB,4GB,1GB. Both fit a64,000-ID BPE with the same preprocessing. DecimalGB refer to uncompressed UTF-8 bytes. These are tokenizer-fitting allocations, not prescribed model-training exposure.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.label{font-size:25px;fill:#6b7280}.mono{font-family:Consolas,monospace}.token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}.amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}.rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}.selected{stroke:#7253ed;stroke-width:3}.accent{fill:#5b3fd4}.edge{fill:none;stroke:#7253ed;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="12" y="38" class="" font-size="33">100 GB pool → two 10 GB fitting samples</text><text x="12" y="160" class="label" >Source</text><text x="330" y="160" class="label" >Full pool</text><text x="650" y="160" class="label" >Sample A</text><text x="970" y="160" class="label" >Sample B</text><path d="M12 185H1240" stroke="#111827" stroke-width="2"/><g data-slice="English" data-pool-bytes="80000000000" data-sample-a-bytes="8000000000" data-sample-b-bytes="5000000000"><text x="12" y="244" class="accent" font-size="34" font-weight="600">English</text><text x="330" y="244" class="" font-size="34">80 GB</text><text x="330" y="280" class="muted" font-size="26">80%</text><text x="650" y="244" class="" font-size="34">8 GB</text><text x="650" y="280" class="muted" font-size="26">80%</text><text x="970" y="244" class="" font-size="34">5 GB</text><text x="970" y="280" class="muted" font-size="26">50%</text><path d="M12 298H1240" stroke="#e5e7eb"/></g><g data-slice="Spanish" data-pool-bytes="15000000000" data-sample-a-bytes="1500000000" data-sample-b-bytes="4000000000"><text x="12" y="339" class="accent" font-size="34" font-weight="600">Spanish</text><text x="330" y="339" class="" font-size="34">15 GB</text><text x="330" y="375" class="muted" font-size="26">15%</text><text x="650" y="339" class="" font-size="34">1.5 GB</text><text x="650" y="375" class="muted" font-size="26">15%</text><text x="970" y="339" class="" font-size="34">4 GB</text><text x="970" y="375" class="muted" font-size="26">40%</text><path d="M12 393H1240" stroke="#e5e7eb"/></g><g data-slice="Code" data-pool-bytes="5000000000" data-sample-a-bytes="500000000" data-sample-b-bytes="1000000000"><text x="12" y="434" class="accent" font-size="34" font-weight="600">Code</text><text x="330" y="434" class="" font-size="34">5 GB</text><text x="330" y="470" class="muted" font-size="26">5%</text><text x="650" y="434" class="" font-size="34">0.5 GB</text><text x="650" y="470" class="muted" font-size="26">5%</text><text x="970" y="434" class="" font-size="34">1 GB</text><text x="970" y="470" class="muted" font-size="26">10%</text><path d="M12 488H1240" stroke="#e5e7eb"/></g><text x="12" y="542" class="accent" font-size="30" font-weight="600">Only the tokenizer-fitting sample changes</text></svg>
