<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">Follow one sentence through the actual tokenizer stages</title>
  <desc id="desc">A measured Qwen3.8-27B trace. NFC changes e plus a combining acute accent into é in Café prices change. The input is displayed with the Unicode escape backslash u0301 to expose that difference. Pre-tokenization creates Café, a space followed by prices, a space followed by change, and a period. BPE splits these regions into C, af, é, space-prices, space-change, and period. Their IDs are 34, 2492, 933, 7336, 2222, 13. Decoding returns the normalized Café prices change., not the original decomposed Unicode sequence. Matching colored pieces and IDs preserve the mapping; the visible space symbol is only a display aid.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs>
  <style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.number{font-size:20px;fill:#7253ed;font-weight:700}
    .label{font-size:26px;font-weight:600}.piece{font-size:29px;text-anchor:middle}
    .id{font-family:Consolas,monospace;font-size:26px;text-anchor:middle}
    .edge{fill:none;stroke:#7253ed;stroke-width:2;marker-end:url(#arrow)}
    .token{stroke-width:1.5}.violet{fill:#f2effe;stroke:#b6a4f2}.teal{fill:#e4f4ee;stroke:#8ac8b3}
    .amber{fill:#fff2d8;stroke:#e4bf73}.blue{fill:#e9f1fe;stroke:#9ebce9}
    .rose{fill:#fcebf0;stroke:#dfa4b8}.slate{fill:#edf1f5;stroke:#acb9c8}
  </style>
  <text class="number" x="12" y="53">01</text><text class="label" x="58" y="53">Normalize</text>
  <text x="300" y="53" font-family="Consolas,monospace" font-size="27">Cafe\u0301 prices change.</text>
  <path class="edge" d="M735 44H785"/>
  <text x="810" y="53" font-size="32">Café prices change.</text>
  <path class="edge" d="M700 81V101"/>
  <text class="number" x="12" y="144">02</text><text class="label" x="58" y="144">Pre-tokenize</text>
  <g fill="#fff" stroke="#cbd0d9" stroke-width="1.5"><rect x="300" y="108" width="264" height="50" rx="7"/><rect x="576" y="108" width="190" height="50" rx="7"/><rect x="778" y="108" width="196" height="50" rx="7"/><rect x="986" y="108" width="82" height="50" rx="7"/></g>
  <text class="piece" x="432" y="143">Café</text><text class="piece" x="671" y="143">·prices</text><text class="piece" x="876" y="143">·change</text><text class="piece" x="1027" y="143">.</text>
  <path class="edge" d="M700 166V187"/>
  <text class="number" x="12" y="231">03</text><text class="label" x="58" y="231">Segment</text>
  <g data-piece="C" data-id="34"><rect class="token violet" x="300" y="196" width="80" height="50" rx="7"/><text class="piece" x="340" y="231">C</text><rect class="token violet" x="300" y="284" width="80" height="50" rx="7"/><text class="id" x="340" y="318">34</text></g>
  <g data-piece="af" data-id="2492"><rect class="token teal" x="392" y="196" width="88" height="50" rx="7"/><text class="piece" x="436" y="231">af</text><rect class="token teal" x="392" y="284" width="88" height="50" rx="7"/><text class="id" x="436" y="318">2492</text></g>
  <g data-piece="é" data-id="933"><rect class="token amber" x="492" y="196" width="72" height="50" rx="7"/><text class="piece" x="528" y="231">é</text><rect class="token amber" x="492" y="284" width="72" height="50" rx="7"/><text class="id" x="528" y="318">933</text></g>
  <g data-piece=" prices" data-id="7336"><rect class="token blue" x="576" y="196" width="190" height="50" rx="7"/><text class="piece" x="671" y="231">·prices</text><rect class="token blue" x="576" y="284" width="190" height="50" rx="7"/><text class="id" x="671" y="318">7336</text></g>
  <g data-piece=" change" data-id="2222"><rect class="token rose" x="778" y="196" width="196" height="50" rx="7"/><text class="piece" x="876" y="231">·change</text><rect class="token rose" x="778" y="284" width="196" height="50" rx="7"/><text class="id" x="876" y="318">2222</text></g>
  <g data-piece="." data-id="13"><rect class="token slate" x="986" y="196" width="82" height="50" rx="7"/><text class="piece" x="1027" y="231">.</text><rect class="token slate" x="986" y="284" width="82" height="50" rx="7"/><text class="id" x="1027" y="318">13</text></g>
  <path class="edge" d="M700 254V275"/>
  <text class="number" x="12" y="318">04</text><text class="label" x="58" y="318">Assign IDs</text>
  <path class="edge" d="M700 342V363"/>
  <text class="number" x="12" y="414">05</text><text class="label" x="58" y="414">Decode</text>
  <rect x="300" y="372" width="768" height="64" rx="8" fill="#f6f7f9" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="324" y="414" font-size="34">Café prices change.</text>
</svg>
