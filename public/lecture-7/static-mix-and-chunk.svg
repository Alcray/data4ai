<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc"><title id="title">Approach 1: token-static sampling</title><desc id="desc">Code documents provide 1.2 million tokens and other text provides 0.8 million. Shuffle whole documents, join them while retaining document boundaries, and pack a fixed token mixture into stored 4,096-position training blocks. The full retained stream contains 60 percent code tokens. Colored segments indicate schematic ordering, not individual documents. Tail targets are retained, not discarded.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827;font-size:25px}.muted{fill:#6b7280;font-size:21px}.small{fill:#6b7280;font-size:18px}.accent{fill:#5b3fd4}.math{font-family:"Cambria Math",Georgia,serif;font-size:26px}.box{fill:#fff;stroke:#e5e7eb;stroke-width:2}.code{fill:#f2effe;stroke:#b6a4f2;stroke-width:2}.prose{fill:#f6f7f9;stroke:#cbd5e1;stroke-width:2}.rail,.edge{fill:none;stroke:#7253ed;stroke-width:2.5}.edge{marker-end:url(#arrow)}</style><g data-approach="token-static" data-code-tokens="1200000" data-text-tokens="800000" data-block-length="4096" data-boundaries="preserved"><rect x="20" y="70" width="250" height="90" rx="8" class="code"/><text x="145" y="108" class="accent" text-anchor="middle">Code stream</text><text x="145" y="139" class="muted" text-anchor="middle">1.2M tokens</text><rect x="20" y="240" width="250" height="90" rx="8" class="prose"/><text x="145" y="278" class="" text-anchor="middle">Text stream</text><text x="145" y="309" class="muted" text-anchor="middle">0.8M tokens</text><path class="rail" d="M270 115H320V200"/><path class="rail" d="M270 285H320V200"/><path class="edge" d="M320 200H355"/><rect x="365" y="145" width="220" height="110" rx="8" class="box"/><text x="475" y="183" class="" text-anchor="middle">Shuffle</text><text x="475" y="212" class="" text-anchor="middle">documents</text><text x="475" y="240" class="small" text-anchor="middle">Keep boundaries</text><path class="edge" d="M585 200H640"/><text x="780" y="126" class="" text-anchor="middle">Joined token stream</text><rect x="650" y="160" width="260" height="80" rx="8" class="box"/><rect class="code" x="660" y="172" width="72" height="56"/><rect class="prose" x="732" y="172" width="48" height="56"/><rect class="code" x="780" y="172" width="36" height="56"/><rect class="prose" x="816" y="172" width="24" height="56"/><rect class="code" x="840" y="172" width="36" height="56"/><rect class="prose" x="876" y="172" width="24" height="56"/><text x="780" y="276" class="small" text-anchor="middle">Order shown schematically</text><path class="edge" d="M910 200H985"/><text x="1120" y="84" class="" text-anchor="middle">Stored training blocks</text><rect x="1000" y="110" width="240" height="50" rx="8" class="box"/><text x="1120" y="143" class="muted" text-anchor="middle">4,096 positions</text><rect x="1000" y="180" width="240" height="50" rx="8" class="box"/><text x="1120" y="213" class="muted" text-anchor="middle">4,096 positions</text><rect x="1000" y="250" width="240" height="50" rx="8" class="box"/><text x="1120" y="283" class="muted" text-anchor="middle">4,096 positions</text><text x="1120" y="333" class="muted" text-anchor="middle">…</text><text x="780" y="392" class="accent" text-anchor="middle">Full retained stream: 60% code tokens</text></g></svg>
