<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc"><title id="title">Approach 3: document-dynamic sampling</title><desc id="desc">Choose the source furthest behind its target allocation, draw a document, and pack and consume its training blocks. Count scored targets actually consumed, then feed those updated counts back to the source selector before choosing the next document. This feedback changes document selection during the run; document boundaries are preserved.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7253ed"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827;font-size:25px}.muted{fill:#6b7280;font-size:21px}.small{fill:#6b7280;font-size:18px}.accent{fill:#5b3fd4}.math{font-family:"Cambria Math",Georgia,serif;font-size:26px}.box{fill:#fff;stroke:#e5e7eb;stroke-width:2}.code{fill:#f2effe;stroke:#b6a4f2;stroke-width:2}.prose{fill:#f6f7f9;stroke:#cbd5e1;stroke-width:2}.rail,.edge{fill:none;stroke:#7253ed;stroke-width:2.5}.edge{marker-end:url(#arrow)}</style><g data-approach="document-dynamic" data-feedback="consumed-targets" data-block-length="4096" data-boundaries="preserved"><rect x="20" y="70" width="250" height="90" rx="8" class="code"/><text x="145" y="108" class="accent" text-anchor="middle">Code documents</text><text x="145" y="139" class="muted" text-anchor="middle">Source pool</text><rect x="20" y="240" width="250" height="90" rx="8" class="prose"/><text x="145" y="278" class="" text-anchor="middle">Text documents</text><text x="145" y="309" class="muted" text-anchor="middle">Source pool</text><path class="rail" d="M270 115H320V200"/><path class="rail" d="M270 285H320V200"/><path class="edge" d="M320 200H355"/><rect x="365" y="145" width="230" height="110" rx="8" class="box"/><text x="480" y="186" class="" text-anchor="middle">Choose a source</text><text x="480" y="225" class="muted" text-anchor="middle">Largest deficit</text><path class="edge" d="M595 200H650"/><rect x="665" y="145" width="230" height="110" rx="8" class="box"/><text x="780" y="186" class="" text-anchor="middle">Draw a document</text><text x="780" y="225" class="muted" text-anchor="middle">Keep boundaries</text><path class="edge" d="M895 200H950"/><rect x="965" y="145" width="280" height="110" rx="8" class="box"/><text x="1105" y="186" class="" text-anchor="middle">Pack and consume</text><text x="1105" y="225" class="muted" text-anchor="middle">4,096 positions</text><path class="edge" d="M1105 265V350H965"/><rect x="655" y="312" width="295" height="76" rx="8" class="box"/><text x="802" y="343" class="" text-anchor="middle">Update counts</text><text x="802" y="373" class="muted" text-anchor="middle">Scored targets consumed</text><path class="edge" stroke-dasharray="8 6" d="M645 350H480V265"/><text x="802" y="430" class="accent" text-anchor="middle">Choose again using updated deficits</text></g></svg>
