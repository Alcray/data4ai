<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" role="img" aria-labelledby="title desc"><title id="title">Tool results are masked from the loss</title><desc id="desc">Four chronological turns: user prompt masked, assistant calculator call scored, tool result masked, assistant final answer scored. Zero mask removes prediction loss on a target, not the target from subsequent attention context.</desc><text x="30" y="40" font-family="Arial,sans-serif" font-size="28" fill="#111827" font-weight="700">Turn</text><text x="345" y="40" font-family="Arial,sans-serif" font-size="28" fill="#111827" font-weight="700">Serialized content</text><text x="1090" y="40" font-family="Arial,sans-serif" font-size="28" fill="#111827" font-weight="700">Loss mask</text><rect x="25" y="65" width="1350" height="80" rx="10" fill="white" stroke="#D7DCE5" stroke-width="2"/><text x="45" y="115" font-family="Arial,sans-serif" font-size="29" fill="#111827" font-weight="700">User</text><text x="345" y="115" font-family="monospace" font-size="25" fill="#111827" font-weight="400">5 total attempts. How many retries?</text><text x="1090" y="115" font-family="Arial,sans-serif" font-size="28" fill="#111827" font-weight="700">0 · masked</text><rect x="25" y="160" width="1350" height="80" rx="10" fill="#F2EFFE" stroke="#D7DCE5" stroke-width="2"/><text x="45" y="210" font-family="Arial,sans-serif" font-size="29" fill="#111827" font-weight="700">Assistant call</text><text x="345" y="210" font-family="monospace" font-size="25" fill="#111827" font-weight="400">calculator({&quot;expression&quot;:&quot;5 - 1&quot;})</text><text x="1090" y="210" font-family="Arial,sans-serif" font-size="28" fill="#7253ED" font-weight="700">1 · scored</text><rect x="25" y="255" width="1350" height="80" rx="10" fill="white" stroke="#D7DCE5" stroke-width="2"/><text x="45" y="305" font-family="Arial,sans-serif" font-size="29" fill="#111827" font-weight="700">Tool result</text><text x="345" y="305" font-family="monospace" font-size="25" fill="#111827" font-weight="400">{&quot;result&quot;:4}</text><text x="1090" y="305" font-family="Arial,sans-serif" font-size="28" fill="#111827" font-weight="700">0 · masked</text><rect x="25" y="350" width="1350" height="80" rx="10" fill="#F2EFFE" stroke="#D7DCE5" stroke-width="2"/><text x="45" y="400" font-family="Arial,sans-serif" font-size="29" fill="#111827" font-weight="700">Assistant answer</text><text x="345" y="400" font-family="monospace" font-size="25" fill="#111827" font-weight="400">Four retries.</text><text x="1090" y="400" font-family="Arial,sans-serif" font-size="28" fill="#7253ED" font-weight="700">1 · scored</text><text x="30" y="510" font-family="Arial,sans-serif" font-size="29" fill="#111827" font-weight="700">Masked tool results stay in the context for the assistant’s next answer.</text></svg>
