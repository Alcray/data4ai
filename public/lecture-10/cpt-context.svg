<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc"><title id="title">Long-context adaptation</title><desc id="desc">Code Llama initial training uses 4096-token sequences; long-context training uses 16384 tokens and adjusts positional embeddings. Both distant information use and short-context behavior are evaluated.</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#7253ED"/></marker></defs><text x="30" y="50" fill="#111827" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="30" dy="0">Code Llama training sequence length</tspan></text><text x="30" y="120" fill="#111827" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="start"><tspan x="30" dy="0">Initial training</tspan></text><rect x="30" y="145" width="320" height="65" rx="10" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><text x="190" y="188" fill="#111827" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle"><tspan x="190" dy="0">4,096 tokens</tspan></text><text x="30" y="290" fill="#111827" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="start"><tspan x="30" dy="0">Long-context stage</tspan></text><rect x="30" y="315" width="1280" height="65" rx="10" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><text x="670" y="358" fill="#111827" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle"><tspan x="670" dy="0">16,384 tokens</tspan></text><path d="M400 310V260H1190V310" fill="none" stroke="#7253ED" stroke-width="3" marker-end="url(#arrow)"/><text x="670" y="244" fill="#111827" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="middle"><tspan x="670" dy="0">Learn dependencies across distant positions</tspan></text><text x="30" y="465" fill="#111827" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="start"><tspan x="30" dy="0">Train with longer sequences</tspan><tspan x="30" dy="37.7">Adjust positional embeddings</tspan></text><text x="790" y="465" fill="#111827" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="start"><tspan x="790" dy="0">Test distant information use</tspan><tspan x="790" dy="37.7">Retest short inputs</tspan></text></svg>
