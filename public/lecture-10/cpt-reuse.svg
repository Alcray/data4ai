<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc"><title id="title">Reuse pretrained weights</title><desc id="desc">Two paths contrast random initialization requiring general pretraining with starting from a pretrained checkpoint and allocating new training to domain data. Diagram lengths are schematic, not compute estimates.</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#7253ED"/></marker></defs><text x="30" y="55" fill="#111827" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="start"><tspan x="30" dy="0">From random weights</tspan></text><rect x="30" y="105" width="230" height="100" rx="10" fill="#FFFFFF" stroke="#D7DCE5" stroke-width="2"/><text x="145.0" y="147.0" fill="#111827" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle"><tspan x="145.0" dy="0">Random</tspan><tspan x="145.0" dy="39.0">initialization</tspan></text><path d="M270 155H345" fill="none" stroke="#7253ED" stroke-width="3" marker-end="url(#arrow)"/><rect x="355" y="105" width="545" height="100" rx="10" fill="#FFFFFF" stroke="#D7DCE5" stroke-width="2"/><text x="627.5" y="165.0" fill="#111827" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle"><tspan x="627.5" dy="0">General pretraining corpus</tspan></text><path d="M910 155H985" fill="none" stroke="#7253ED" stroke-width="3" marker-end="url(#arrow)"/><rect x="995" y="105" width="375" height="100" rx="10" fill="#F2EFFE" stroke="#D7DCE5" stroke-width="2"/><text x="1182.5" y="165.0" fill="#111827" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle"><tspan x="1182.5" dy="0">Domain corpus</tspan></text><text x="30" y="325" fill="#111827" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="start"><tspan x="30" dy="0">From pretrained weights</tspan></text><rect x="30" y="370" width="385" height="100" rx="10" fill="#F2EFFE" stroke="#D7DCE5" stroke-width="2"/><text x="222.5" y="430.0" fill="#111827" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle"><tspan x="222.5" dy="0">Existing checkpoint</tspan></text><path d="M425 420H985" fill="none" stroke="#7253ED" stroke-width="3" marker-end="url(#arrow)"/><rect x="995" y="370" width="375" height="100" rx="10" fill="#F2EFFE" stroke="#D7DCE5" stroke-width="2"/><text x="1182.5" y="430.0" fill="#111827" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle"><tspan x="1182.5" dy="0">Domain corpus</tspan></text><text x="700" y="402" fill="#111827" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">Reuse learned structure</tspan></text></svg>
