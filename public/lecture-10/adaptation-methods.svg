<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc"><title id="title">Prompting, context, and training methods</title><desc id="desc">The root branches left to prompting and context, with unchanged model weights, and right to training, the focus of this lecture. The left branch contains zero-shot, few-shot, chain-of-thought and self-checking prompts, plus retrieval of context passages. The right branch contains continued pretraining and supervised fine-tuning as objectives. Either objective can use full fine-tuning or LoRA for parameter updates; LoRA is not a third objective or a required stage after SFT.</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#7253ED"/></marker></defs><path d="M700 75V105H345V130" fill="none" stroke="#7253ED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M700 105H1055V130" fill="none" stroke="#7253ED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M345 200V219H218V238" fill="none" stroke="#7253ED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M345 219H548V238" fill="none" stroke="#7253ED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1055 200V219H890V238" fill="none" stroke="#7253ED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1055 219H1220V238" fill="none" stroke="#7253ED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M890 385V404H1055V428" fill="none" stroke="#7253ED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1220 385V404H1055" fill="none" stroke="#7253ED" stroke-width="2.5"/><rect x="390" y="5" width="620" height="70" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="700" y="50" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">How to improve a language model</tspan></text><rect x="25" y="130" width="640" height="70" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="2"/><text x="345" y="174" fill="#111827" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle"><tspan x="345" dy="0">Prompting · fixed weights</tspan></text><rect x="735" y="130" width="640" height="70" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="1055" y="174" fill="#7253ED" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle"><tspan x="1055" dy="0">Training · parameter updates</tspan></text><rect x="25" y="238" width="385" height="292" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="2"/><text x="45" y="278" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="45" dy="0">Prompt design</tspan></text><text x="45" y="328" fill="#111827" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="45" dy="0">Zero-shot instructions</tspan><tspan x="45" dy="36.4">Few-shot examples</tspan><tspan x="45" dy="36.4">Chain-of-thought prompts</tspan><tspan x="45" dy="36.4">Self-checking prompts</tspan></text><rect x="435" y="238" width="230" height="292" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="2"/><text x="455" y="278" fill="#111827" font-family="Arial, sans-serif" font-size="26" font-weight="700"><tspan x="455" dy="0">Retrieval (RAG)</tspan></text><text x="455" y="335" fill="#111827" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="455" dy="0">Add retrieved</tspan><tspan x="455" dy="36.4">passages to</tspan><tspan x="455" dy="36.4">the context</tspan></text><rect x="735" y="238" width="310" height="147" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="755" y="278" fill="#7253ED" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="755" dy="0">CPT</tspan></text><text x="755" y="321" fill="#111827" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="755" dy="0">Next-token prediction</tspan><tspan x="755" dy="35.0">on additional text</tspan></text><rect x="1065" y="238" width="310" height="147" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="1085" y="278" fill="#7253ED" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="1085" dy="0">SFT</tspan></text><text x="1085" y="321" fill="#111827" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="1085" dy="0">Imitate desired</tspan><tspan x="1085" dy="35.0">responses to inputs</tspan></text><rect x="735" y="428" width="640" height="102" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="2"/><text x="1055" y="490" fill="#7253ED" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle"><tspan x="1055" dy="0">Full fine-tuning  or  LoRA</tspan></text></svg>
