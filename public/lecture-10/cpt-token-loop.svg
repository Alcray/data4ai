<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc"><title id="title">CPT next-token training</title><desc id="desc">A corpus prefix goes into a pretrained model. The following corpus token is the target. Prediction error feeds back into weight updates.</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#7253ED"/></marker></defs><text x="30" y="48" fill="#111827" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="30" dy="0">New domain text</tspan></text><rect x="30" y="80" width="155" height="58" rx="10" fill="#FFFFFF" stroke="#D7DCE5" stroke-width="2"/><text x="107.5" y="118" fill="#111827" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="middle"><tspan x="107.5" dy="0">A retry</tspan></text><rect x="195" y="80" width="160" height="58" rx="10" fill="#FFFFFF" stroke="#D7DCE5" stroke-width="2"/><text x="275.0" y="118" fill="#111827" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="middle"><tspan x="275.0" dy="0">repeats</tspan></text><rect x="365" y="80" width="170" height="58" rx="10" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><text x="450.0" y="118" fill="#111827" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle"><tspan x="450.0" dy="0">a request</tspan></text><path d="M280 150V238H595" fill="none" stroke="#7253ED" stroke-width="3" marker-end="url(#arrow)"/><text x="310" y="210" fill="#111827" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="start"><tspan x="310" dy="0">Prefix</tspan></text><rect x="600" y="170" width="230" height="175" rx="10" fill="#F2EFFE" stroke="#7253ED" stroke-width="2"/><path d="M648 206L715 206" fill="none" stroke="#D7DCE5" stroke-width="3"/><path d="M648 206L715 248" fill="none" stroke="#D7DCE5" stroke-width="3"/><path d="M648 206L715 290" fill="none" stroke="#D7DCE5" stroke-width="3"/><circle cx="648" cy="206" r="9" fill="#7253ED"/><path d="M648 248L715 206" fill="none" stroke="#D7DCE5" stroke-width="3"/><path d="M648 248L715 248" fill="none" stroke="#D7DCE5" stroke-width="3"/><path d="M648 248L715 290" fill="none" stroke="#D7DCE5" stroke-width="3"/><circle cx="648" cy="248" r="9" fill="#7253ED"/><path d="M648 290L715 206" fill="none" stroke="#D7DCE5" stroke-width="3"/><path d="M648 290L715 248" fill="none" stroke="#D7DCE5" stroke-width="3"/><path d="M648 290L715 290" fill="none" stroke="#D7DCE5" stroke-width="3"/><circle cx="648" cy="290" r="9" fill="#7253ED"/><path d="M715 206L782 206" fill="none" stroke="#D7DCE5" stroke-width="3"/><path d="M715 206L782 248" fill="none" stroke="#D7DCE5" stroke-width="3"/><path d="M715 206L782 290" fill="none" stroke="#D7DCE5" stroke-width="3"/><circle cx="715" cy="206" r="9" fill="#7253ED"/><path d="M715 248L782 206" fill="none" stroke="#D7DCE5" stroke-width="3"/><path d="M715 248L782 248" fill="none" stroke="#D7DCE5" stroke-width="3"/><path d="M715 248L782 290" fill="none" stroke="#D7DCE5" stroke-width="3"/><circle cx="715" cy="248" r="9" fill="#7253ED"/><path d="M715 290L782 206" fill="none" stroke="#D7DCE5" stroke-width="3"/><path d="M715 290L782 248" fill="none" stroke="#D7DCE5" stroke-width="3"/><path d="M715 290L782 290" fill="none" stroke="#D7DCE5" stroke-width="3"/><circle cx="715" cy="290" r="9" fill="#7253ED"/><circle cx="782" cy="206" r="9" fill="#7253ED"/><circle cx="782" cy="248" r="9" fill="#7253ED"/><circle cx="782" cy="290" r="9" fill="#7253ED"/><text x="715" y="385" fill="#111827" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle"><tspan x="715" dy="0">Pretrained model</tspan></text><path d="M835 250H960" fill="none" stroke="#7253ED" stroke-width="3" marker-end="url(#arrow)"/><rect x="970" y="200" width="390" height="100" rx="10" fill="#F2EFFE" stroke="#D7DCE5" stroke-width="2"/><text x="1165.0" y="242.0" fill="#111827" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle"><tspan x="1165.0" dy="0">Next-token</tspan><tspan x="1165.0" dy="39.0">prediction</tspan></text><path d="M450 145V165H1165V195" fill="none" stroke="#7253ED" stroke-width="3" marker-end="url(#arrow)"/><text x="770" y="151" fill="#111827" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="start"><tspan x="770" dy="0">Target from the same text</tspan></text><path d="M1165 310V460H550V320H595" fill="none" stroke="#7253ED" stroke-width="3" marker-end="url(#arrow)"/><text x="740" y="504" fill="#111827" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start"><tspan x="740" dy="0">Prediction error updates the weights</tspan></text></svg>
