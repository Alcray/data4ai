<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc"><title id="title">One task with three assistant outputs</title><desc id="desc">Three retries after the initial attempt require four total attempts. The first output is valid JSON with the wrong total of three. The second gives four in prose but violates the JSON format. The third gives four attempts in the required JSON format. These are constructed outputs, not measured model responses.</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#7253ED"/></marker></defs><text x="25" y="42" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="700"><tspan x="25" dy="0">3 retries after the first attempt. Return total attempts as JSON.</tspan></text><text x="43" y="178" fill="#7253ED" font-family="Arial, sans-serif" font-size="30" font-weight="700"><tspan x="43" dy="0">Wrong answer</tspan></text><rect x="25" y="205" width="430" height="180" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="2"/><text x="45" y="270" fill="#111827" font-family="Consolas, monospace" font-size="27" font-weight="400"><tspan x="45" dy="0">{&quot;answer&quot;: 3,</tspan><tspan x="45" dy="37.8"> &quot;unit&quot;: &quot;attempts&quot;}</tspan></text><text x="43" y="450" fill="#111827" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="43" dy="0">Valid JSON</tspan><tspan x="43" dy="37.8">Incorrect total</tspan></text><text x="503" y="178" fill="#7253ED" font-family="Arial, sans-serif" font-size="30" font-weight="700"><tspan x="503" dy="0">Wrong format</tspan></text><rect x="485" y="205" width="430" height="180" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="2"/><text x="505" y="270" fill="#111827" font-family="Consolas, monospace" font-size="27" font-weight="400"><tspan x="505" dy="0">Four attempts in total.</tspan></text><text x="503" y="450" fill="#111827" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="503" dy="0">Correct total</tspan><tspan x="503" dy="37.8">Plain text instead of JSON</tspan></text><text x="963" y="178" fill="#7253ED" font-family="Arial, sans-serif" font-size="30" font-weight="700"><tspan x="963" dy="0">Expected output</tspan></text><rect x="945" y="205" width="430" height="180" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="965" y="270" fill="#111827" font-family="Consolas, monospace" font-size="27" font-weight="400"><tspan x="965" dy="0">{&quot;answer&quot;: 4,</tspan><tspan x="965" dy="37.8"> &quot;unit&quot;: &quot;attempts&quot;}</tspan></text><text x="963" y="450" fill="#111827" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="963" dy="0">Correct total</tspan><tspan x="963" dy="37.8">Required JSON format</tspan></text></svg>
