<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc"><title id="title">Fix evaluation before training</title><desc id="desc">Validation data and scoring are frozen first. The base and training checkpoints use the same target-domain and retention evaluation. Validation selects a checkpoint, followed by a separate final test.</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#7253ED"/></marker></defs><rect x="30" y="50" width="315" height="95" rx="10" fill="#FFFFFF" stroke="#D7DCE5" stroke-width="2"/><text x="187.5" y="89.5" fill="#111827" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle"><tspan x="187.5" dy="0">Freeze validation</tspan><tspan x="187.5" dy="39.0">and scoring</tspan></text><path d="M355 98H420" fill="none" stroke="#7253ED" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="50" width="300" height="95" rx="10" fill="#F2EFFE" stroke="#D7DCE5" stroke-width="2"/><text x="580.0" y="107.5" fill="#111827" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle"><tspan x="580.0" dy="0">Score the base</tspan></text><path d="M740 98H805" fill="none" stroke="#7253ED" stroke-width="3" marker-end="url(#arrow)"/><rect x="815" y="50" width="540" height="95" rx="10" fill="#FFFFFF" stroke="#D7DCE5" stroke-width="2"/><text x="1085.0" y="107.5" fill="#111827" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle"><tspan x="1085.0" dy="0">Train and save checkpoints</tspan></text><path d="M580 155V265H650" fill="none" stroke="#7253ED" stroke-width="3" marker-end="url(#arrow)"/><path d="M1085 155V265H1020" fill="none" stroke="#7253ED" stroke-width="3" marker-end="url(#arrow)"/><rect x="660" y="215" width="350" height="100" rx="10" fill="#F2EFFE" stroke="#D7DCE5" stroke-width="2"/><text x="835.0" y="257.0" fill="#111827" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle"><tspan x="835.0" dy="0">Same evaluation</tspan><tspan x="835.0" dy="39.0">for every model</tspan></text><rect x="65" y="235" width="125" height="140" rx="10" fill="#FFFFFF" stroke="#D7DCE5" stroke-width="2"/><path d="M90 277H165M90 301H165M90 325H143" fill="none" stroke="#111827" stroke-width="3"/><text x="127" y="415" fill="#111827" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="middle"><tspan x="127" dy="0"></tspan></text><text x="127" y="205" fill="#111827" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="middle"><tspan x="127" dy="0">Target domain</tspan></text><rect x="305" y="235" width="125" height="140" rx="10" fill="#FFFFFF" stroke="#D7DCE5" stroke-width="2"/><path d="M330 277H405M330 301H405M330 325H383" fill="none" stroke="#111827" stroke-width="3"/><text x="367" y="415" fill="#111827" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="middle"><tspan x="367" dy="0"></tspan></text><text x="367" y="205" fill="#111827" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="middle"><tspan x="367" dy="0">Retained skills</tspan></text><path d="M440 300H650" fill="none" stroke="#7253ED" stroke-width="3" marker-end="url(#arrow)"/><path d="M835 325V390H232V410" fill="none" stroke="#7253ED" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="420" width="395" height="100" rx="10" fill="#FFFFFF" stroke="#D7DCE5" stroke-width="2"/><text x="232.5" y="462.0" fill="#111827" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle"><tspan x="232.5" dy="0">Compare with baseline</tspan><tspan x="232.5" dy="39.0">and regression limits</tspan></text><path d="M440 470H690" fill="none" stroke="#7253ED" stroke-width="3" marker-end="url(#arrow)"/><rect x="700" y="420" width="655" height="100" rx="10" fill="#F2EFFE" stroke="#D7DCE5" stroke-width="2"/><text x="1027.5" y="462.0" fill="#111827" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle"><tspan x="1027.5" dy="0">Select on validation</tspan><tspan x="1027.5" dy="39.0">Confirm once on the final test</tspan></text></svg>
