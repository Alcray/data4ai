<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img"><title>Two equally likely next tokens give perplexity two; ten equally likely next tokens give perplexity ten. The equality requires uniform probabilities.</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#7253ED"/></marker></defs><text x="30" y="43" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="30" dy="0">Same prefix: “I like ___”. Toy vocabulary: each choice is one token.</tspan></text><text x="40" y="111" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="700"><tspan x="40" dy="0">Two equally likely choices</tspan></text><text x="740" y="111" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="700"><tspan x="740" dy="0">Ten equally likely choices</tspan></text><rect x="60" y="158" width="240" height="105" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="84" y="200" fill="#7253ED" font-family="Arial, sans-serif" font-size="30" font-weight="700"><tspan x="84" dy="0">apple</tspan></text><text x="84" y="241" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="400"><tspan x="84" dy="0">50% probability</tspan></text><rect x="350" y="158" width="240" height="105" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="374" y="200" fill="#7253ED" font-family="Arial, sans-serif" font-size="30" font-weight="700"><tspan x="374" dy="0">pear</tspan></text><text x="374" y="241" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="400"><tspan x="374" dy="0">50% probability</tspan></text><rect x="740" y="150" width="115" height="90" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="750" y="184" fill="#7253ED" font-family="Arial, sans-serif" font-size="22" font-weight="700"><tspan x="750" dy="0">apple</tspan></text><text x="768" y="219" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="768" dy="0">10%</tspan></text><rect x="868" y="150" width="115" height="90" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="878" y="184" fill="#7253ED" font-family="Arial, sans-serif" font-size="22" font-weight="700"><tspan x="878" dy="0">pear</tspan></text><text x="896" y="219" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="896" dy="0">10%</tspan></text><rect x="996" y="150" width="115" height="90" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="1006" y="184" fill="#7253ED" font-family="Arial, sans-serif" font-size="22" font-weight="700"><tspan x="1006" dy="0">peach</tspan></text><text x="1024" y="219" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="1024" dy="0">10%</tspan></text><rect x="1124" y="150" width="115" height="90" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="1134" y="184" fill="#7253ED" font-family="Arial, sans-serif" font-size="22" font-weight="700"><tspan x="1134" dy="0">plum</tspan></text><text x="1152" y="219" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="1152" dy="0">10%</tspan></text><rect x="1252" y="150" width="115" height="90" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="1262" y="184" fill="#7253ED" font-family="Arial, sans-serif" font-size="22" font-weight="700"><tspan x="1262" dy="0">mango</tspan></text><text x="1280" y="219" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="1280" dy="0">10%</tspan></text><rect x="740" y="256" width="115" height="90" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="750" y="290" fill="#7253ED" font-family="Arial, sans-serif" font-size="22" font-weight="700"><tspan x="750" dy="0">banana</tspan></text><text x="768" y="325" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="768" dy="0">10%</tspan></text><rect x="868" y="256" width="115" height="90" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="878" y="290" fill="#7253ED" font-family="Arial, sans-serif" font-size="22" font-weight="700"><tspan x="878" dy="0">orange</tspan></text><text x="896" y="325" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="896" dy="0">10%</tspan></text><rect x="996" y="256" width="115" height="90" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="1006" y="290" fill="#7253ED" font-family="Arial, sans-serif" font-size="22" font-weight="700"><tspan x="1006" dy="0">grape</tspan></text><text x="1024" y="325" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="1024" dy="0">10%</tspan></text><rect x="1124" y="256" width="115" height="90" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="1134" y="290" fill="#7253ED" font-family="Arial, sans-serif" font-size="22" font-weight="700"><tspan x="1134" dy="0">cherry</tspan></text><text x="1152" y="325" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="1152" dy="0">10%</tspan></text><rect x="1252" y="256" width="115" height="90" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="1262" y="290" fill="#7253ED" font-family="Arial, sans-serif" font-size="22" font-weight="700"><tspan x="1262" dy="0">melon</tspan></text><text x="1280" y="325" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="1280" dy="0">10%</tspan></text><text x="55" y="385" fill="#111827" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="55" dy="0">Observed token probability: 1/2</tspan></text><text x="740" y="385" fill="#111827" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="740" dy="0">Observed token probability: 1/10</tspan></text><text x="55" y="440" fill="#7253ED" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="55" dy="0">exp(−ln(1/2)) = 2</tspan></text><text x="740" y="440" fill="#7253ED" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="740" dy="0">exp(−ln(1/10)) = 10</tspan></text><text x="55" y="493" fill="#7253ED" font-family="Arial, sans-serif" font-size="40" font-weight="700"><tspan x="55" dy="0">Perplexity 2</tspan></text><text x="740" y="493" fill="#7253ED" font-family="Arial, sans-serif" font-size="40" font-weight="700"><tspan x="740" dy="0">Perplexity 10</tspan></text><text x="30" y="552" fill="#111827" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="30" dy="0">Equal probabilities make perplexity exactly the number of choices.</tspan></text><text x="30" y="590" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="30" dy="0">In general it is an equivalent average uncertainty, not a count of all possible tokens.</tspan></text></svg>
