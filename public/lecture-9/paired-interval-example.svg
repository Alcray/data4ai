<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img"><title>The approximate 95 percent paired normal interval is minus 0.77 to plus 4.77 percentage points. It crosses zero, so this hypothetical sample does not establish a positive population gain. Fixed benchmark scores themselves are exact.</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#7253ED"/></marker></defs><text x="30" y="43" fill="#111827" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="30" dy="0">Same example: a 2-point gain with a 1.41-point standard error.</tspan></text><text x="50" y="139" fill="#6B7280" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="50" dy="0">Approximate 95% interval</tspan></text><text x="50" y="198" fill="#7253ED" font-family="Arial, sans-serif" font-size="36" font-weight="700"><tspan x="50" dy="0">2.00 ± 1.96 × 1.413 = [−0.77, +4.77] percentage points</tspan></text><path d="M160 343H1280" stroke="#6B7280" stroke-width="2"/><path d="M160 336V351" stroke="#6B7280" stroke-width="2"/><text x="143" y="383" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="143" dy="0">-2</tspan></text><path d="M320 336V351" stroke="#6B7280" stroke-width="2"/><text x="303" y="383" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="303" dy="0">-1</tspan></text><path d="M480 336V351" stroke="#6B7280" stroke-width="2"/><text x="463" y="383" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="463" dy="0">0</tspan></text><path d="M640 336V351" stroke="#6B7280" stroke-width="2"/><text x="623" y="383" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="623" dy="0">+1</tspan></text><path d="M800 336V351" stroke="#6B7280" stroke-width="2"/><text x="783" y="383" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="783" dy="0">+2</tspan></text><path d="M960 336V351" stroke="#6B7280" stroke-width="2"/><text x="943" y="383" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="943" dy="0">+3</tspan></text><path d="M1120 336V351" stroke="#6B7280" stroke-width="2"/><text x="1103" y="383" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="1103" dy="0">+4</tspan></text><path d="M1280 336V351" stroke="#6B7280" stroke-width="2"/><text x="1263" y="383" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="1263" dy="0">+5</tspan></text><path d="M480 234V343" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 6"/><path d="M356.9472 287H1243.0528M356.9472 272V302M1243.0528 272V302" stroke="#7253ED" stroke-width="7"/><circle cx="800" cy="287" r="10" fill="#7253ED"/><text x="740" y="255" fill="#7253ED" font-family="Arial, sans-serif" font-size="27" font-weight="700"><tspan x="740" dy="0">Gain: +2</tspan></text><text x="50" y="459" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="50" dy="0">The interval crosses zero: this sample does not establish a positive population gain.</tspan></text><text x="50" y="516" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="50" dy="0">The saved benchmark scores are exactly 80% and 82%.</tspan></text><text x="50" y="565" fill="#6B7280" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="50" dy="0">The interval concerns similar future tasks under the sampling assumptions.</tspan></text></svg>
