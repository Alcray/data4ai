<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img"><title>One upload-limit task is checked for valid JSON, correct value and unit, supporting citation, and final all-checks success.</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#7253ED"/></marker></defs><text x="30" y="42" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="30" dy="0">Question: What is the maximum upload size?</tspan></text><text x="30" y="90" fill="#111827" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="30" dy="0">Approved source limits-v1: “Maximum upload size: 20 MB.”</tspan></text><rect x="30" y="122" width="1340" height="78" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/><text x="54" y="171" fill="#111827" font-family="Arial, sans-serif" font-size="29" font-weight="400"><tspan x="54" dy="0">Model response: {&quot;answer&quot;:20, &quot;unit&quot;:&quot;MB&quot;, &quot;citation&quot;:&quot;limits-v1&quot;}</tspan></text><rect x="30" y="282" width="299" height="205" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="48" y="325" fill="#7253ED" font-family="Arial, sans-serif" font-size="25" font-weight="700"><tspan x="48" dy="0">1. Parse JSON</tspan></text><text x="48" y="389" fill="#111827" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="48" dy="0">Valid JSON</tspan><tspan x="48" dy="35.1">All fields present</tspan></text><path d="M329 385L377 385" fill="none" stroke="#7253ED" stroke-width="2" marker-end="url(#arrow)"/><rect x="377" y="282" width="299" height="205" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="395" y="325" fill="#7253ED" font-family="Arial, sans-serif" font-size="25" font-weight="700"><tspan x="395" dy="0">2. Value and unit</tspan></text><text x="395" y="389" fill="#111827" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="395" dy="0">20 MB matches</tspan><tspan x="395" dy="35.1">the reference</tspan></text><path d="M676 385L724 385" fill="none" stroke="#7253ED" stroke-width="2" marker-end="url(#arrow)"/><rect x="724" y="282" width="299" height="205" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="742" y="325" fill="#7253ED" font-family="Arial, sans-serif" font-size="25" font-weight="700"><tspan x="742" dy="0">3. Evidence</tspan></text><text x="742" y="389" fill="#111827" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="742" dy="0">limits-v1 exists</tspan><tspan x="742" dy="35.1">and states 20 MB</tspan></text><path d="M1023 385L1071 385" fill="none" stroke="#7253ED" stroke-width="2" marker-end="url(#arrow)"/><rect x="1071" y="282" width="299" height="205" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="1089" y="325" fill="#7253ED" font-family="Arial, sans-serif" font-size="25" font-weight="700"><tspan x="1089" dy="0">4. Outcome</tspan></text><text x="1089" y="389" fill="#111827" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="1089" dy="0">All three pass</tspan><tspan x="1089" dy="35.1">Success: yes</tspan></text><text x="30" y="553" fill="#6B7280" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="30" dy="0">A valid JSON answer can still fail on its value, unit, or supporting citation.</tspan></text></svg>
