<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img"><title>I go. has four toy tokens but five UTF-8 bytes. A loss of 4.1589 nats is six bits, or 1.2 bits per byte.</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#7253ED"/></marker></defs><text x="30" y="43" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="30" dy="0">Byte-counting example: “I go.” contains five UTF-8 bytes.</tspan></text><text x="30" y="130" fill="#6B7280" font-family="Arial, sans-serif" font-size="27" font-weight="700"><tspan x="30" dy="0">4 tokens</tspan></text><text x="30" y="260" fill="#6B7280" font-family="Arial, sans-serif" font-size="27" font-weight="700"><tspan x="30" dy="0">5 bytes</tspan></text><rect x="300" y="86" width="140" height="68" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="330" y="131" fill="#7253ED" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="330" dy="0">I</tspan></text><rect x="460" y="86" width="140" height="68" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="474" y="131" fill="#7253ED" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="474" dy="0">space</tspan></text><rect x="620" y="86" width="300" height="68" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="650" y="131" fill="#7253ED" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="650" dy="0">go</tspan></text><rect x="940" y="86" width="140" height="68" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="970" y="131" fill="#7253ED" font-family="Arial, sans-serif" font-size="34" font-weight="700"><tspan x="970" dy="0">.</tspan></text><rect x="300" y="216" width="140" height="68" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/><text x="335" y="260" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="400"><tspan x="335" dy="0">49</tspan></text><rect x="460" y="216" width="140" height="68" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/><text x="495" y="260" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="400"><tspan x="495" dy="0">20</tspan></text><rect x="620" y="216" width="140" height="68" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/><text x="655" y="260" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="400"><tspan x="655" dy="0">67</tspan></text><rect x="780" y="216" width="140" height="68" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/><text x="815" y="260" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="400"><tspan x="815" dy="0">6F</tspan></text><rect x="940" y="216" width="140" height="68" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/><text x="975" y="260" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="400"><tspan x="975" dy="0">2E</tspan></text><path d="M370 154L370 216" fill="none" stroke="#7253ED" stroke-width="2" marker-end="url(#arrow)"/><path d="M530 154L530 216" fill="none" stroke="#7253ED" stroke-width="2" marker-end="url(#arrow)"/><path d="M1010 154L1010 216" fill="none" stroke="#7253ED" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 154V184H690V206M770 184H850V206" fill="none" stroke="#7253ED" stroke-width="2"/><path d="M690 206L690 216" fill="none" stroke="#7253ED" stroke-width="2" marker-end="url(#arrow)"/><path d="M850 206L850 216" fill="none" stroke="#7253ED" stroke-width="2" marker-end="url(#arrow)"/><text x="1120" y="246" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="1120" dy="0">Hexadecimal</tspan><tspan x="1120" dy="33.75">byte values</tspan></text><rect x="35" y="360" width="400" height="150" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="59" y="396" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="59" dy="0">1. Total loss</tspan></text><text x="59" y="444" fill="#7253ED" font-family="Arial, sans-serif" font-size="37" font-weight="700"><tspan x="59" dy="0">4.1589 nats</tspan></text><text x="59" y="483" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="400"><tspan x="59" dy="0">Same scored content</tspan></text><path d="M435 435L490 435" fill="none" stroke="#7253ED" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="360" width="400" height="150" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="514" y="396" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="514" dy="0">2. Convert to bits</tspan></text><text x="514" y="444" fill="#7253ED" font-family="Arial, sans-serif" font-size="37" font-weight="700"><tspan x="514" dy="0">6 bits</tspan></text><text x="514" y="483" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="400"><tspan x="514" dy="0">4.1589 ÷ ln(2)</tspan></text><path d="M890 435L945 435" fill="none" stroke="#7253ED" stroke-width="2" marker-end="url(#arrow)"/><rect x="945" y="360" width="400" height="150" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="969" y="396" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="969" dy="0">3. Bits per byte</tspan></text><text x="969" y="444" fill="#7253ED" font-family="Arial, sans-serif" font-size="37" font-weight="700"><tspan x="969" dy="0">1.2 bits/byte</tspan></text><text x="969" y="483" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="400"><tspan x="969" dy="0">6 bits ÷ 5 bytes</tspan></text><text x="35" y="576" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="35" dy="0">Count the space and punctuation; exclude the unscored [START] context.</tspan></text></svg>
