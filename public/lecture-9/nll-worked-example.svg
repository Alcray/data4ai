<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img"><title>The held-out next token is mat. Its model probability is 50 percent, so its negative log-likelihood is 0.6931 nats. Lower probability gives greater loss.</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#7253ED"/></marker></defs><text x="30" y="43" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="30" dy="0">1. Read one held-out sentence; hide its next token from the model.</tspan></text><rect x="30" y="75" width="860" height="100" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/><text x="54" y="108" fill="#6B7280" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="54" dy="0">Context sent to the model</tspan></text><text x="54" y="151" fill="#111827" font-family="Arial, sans-serif" font-size="36" font-weight="400"><tspan x="54" dy="0">The cat sat on the</tspan></text><rect x="990" y="75" width="380" height="100" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="1010" y="108" fill="#6B7280" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="1010" dy="0">Observed next token</tspan></text><text x="1010" y="151" fill="#7253ED" font-family="Arial, sans-serif" font-size="36" font-weight="700"><tspan x="1010" dy="0">mat</tspan></text><path d="M890 125L990 125" fill="none" stroke="#7253ED" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="245" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="30" dy="0">2. Model probabilities</tspan></text><text x="850" y="245" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="850" dy="0">3. Score the observed word</tspan></text><rect x="30" y="275" width="710" height="65" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="49" y="317" fill="#7253ED" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="49" dy="0">mat (observed)</tspan></text><rect x="330" y="294" width="250.0" height="26" rx="3" fill="#7253ED"/><text x="631" y="317" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="631" dy="0">50%</tspan></text><rect x="30" y="350" width="710" height="65" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/><text x="49" y="392" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="49" dy="0">floor</tspan></text><rect x="330" y="369" width="125.0" height="26" rx="3" fill="#E5E7EB"/><text x="631" y="392" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="631" dy="0">25%</tspan></text><rect x="30" y="425" width="710" height="65" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/><text x="49" y="467" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="49" dy="0">sofa</tspan></text><rect x="330" y="444" width="125.0" height="26" rx="3" fill="#E5E7EB"/><text x="631" y="467" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="631" dy="0">25%</tspan></text><rect x="850" y="275" width="520" height="215" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="872" y="321" fill="#7253ED" font-family="Arial, sans-serif" font-size="30" font-weight="700"><tspan x="872" dy="0">Use p(mat) = 0.50</tspan></text><text x="872" y="375" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="400"><tspan x="872" dy="0">−ln(0.50) = 0.6931 nats</tspan></text><text x="872" y="430" fill="#6B7280" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="872" dy="0">Score the word in the text,</tspan><tspan x="872" dy="31.05">even if another word ranks first.</tspan></text><path d="M740 308L850 308" fill="none" stroke="#7253ED" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="545" fill="#7253ED" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="30" dy="0">If p(mat) drops to 0.25, its loss rises to 1.3863 nats.</tspan></text><text x="30" y="587" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="30" dy="0">Whole-text loss: repeat for every scored next token, then add the losses.</tspan></text></svg>
