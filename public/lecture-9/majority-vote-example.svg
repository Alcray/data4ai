<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img"><title>Five answers are 65, 65, 67, 65, 66. Pass at five succeeds because 67 is present. Majority at five fails because the most frequent answer is 65.</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#7253ED"/></marker></defs><text x="30" y="43" fill="#111827" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="30" dy="0">pass@5: Is at least one of the five answers correct?</tspan></text><text x="30" y="91" fill="#111827" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="30" dy="0">majority@5: Is the most frequent answer correct?</tspan></text><text x="30" y="167" fill="#6B7280" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="30" dy="0">Generate five answers to 8 × 9 − 5. Correct answer: 67.</tspan></text><rect x="115" y="220" width="180" height="85" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/><text x="172" y="267" fill="#111827" font-family="Arial, sans-serif" font-size="37" font-weight="400"><tspan x="172" dy="0">65</tspan></text><rect x="365" y="220" width="180" height="85" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/><text x="422" y="267" fill="#111827" font-family="Arial, sans-serif" font-size="37" font-weight="400"><tspan x="422" dy="0">65</tspan></text><rect x="615" y="220" width="180" height="85" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="672" y="267" fill="#7253ED" font-family="Arial, sans-serif" font-size="37" font-weight="700"><tspan x="672" dy="0">67</tspan></text><text x="664" y="294" fill="#7253ED" font-family="Arial, sans-serif" font-size="20" font-weight="400"><tspan x="664" dy="0">correct</tspan></text><rect x="865" y="220" width="180" height="85" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/><text x="922" y="267" fill="#111827" font-family="Arial, sans-serif" font-size="37" font-weight="400"><tspan x="922" dy="0">65</tspan></text><rect x="1115" y="220" width="180" height="85" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/><text x="1172" y="267" fill="#111827" font-family="Arial, sans-serif" font-size="37" font-weight="400"><tspan x="1172" dy="0">66</tspan></text><path d="M115 315V330H1295V315M700 330V365" fill="none" stroke="#7253ED" stroke-width="2"/><path d="M700 365H350V400M700 365H1050V400" fill="none" stroke="#7253ED" stroke-width="2" marker-end="url(#arrow)"/><path d="M350 390L350 400" fill="none" stroke="#7253ED" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="400" width="640" height="135" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="54" y="444" fill="#7253ED" font-family="Arial, sans-serif" font-size="31" font-weight="700"><tspan x="54" dy="0">pass@5: SUCCESS</tspan></text><text x="54" y="495" fill="#111827" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="54" dy="0">67 appears among the five answers.</tspan></text><rect x="730" y="400" width="640" height="135" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="754" y="444" fill="#7253ED" font-family="Arial, sans-serif" font-size="31" font-weight="700"><tspan x="754" dy="0">majority@5: FAILURE</tspan></text><text x="754" y="495" fill="#111827" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="754" dy="0">65 gets three votes, but it is wrong.</tspan></text><text x="30" y="585" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="400"><tspan x="30" dy="0">Across tasks, report the fraction of successful outcomes for each rule.</tspan></text></svg>
