<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img"><title>Hypothetical MATH-500 comparison. Both models answer 380 questions correctly; A alone answers 20, B alone answers 30, and both miss 70. B improves by ten out of 500, or two percentage points.</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#7253ED"/></marker></defs><text x="30" y="43" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="30" dy="0">Hypothetical MATH-500 results: the same 500 questions for both models.</tspan></text><text x="45" y="112" fill="#6B7280" font-family="Arial, sans-serif" font-size="26" font-weight="700"><tspan x="45" dy="0">Outcome</tspan></text><text x="600" y="112" fill="#6B7280" font-family="Arial, sans-serif" font-size="26" font-weight="700"><tspan x="600" dy="0">Questions</tspan></text><text x="890" y="112" fill="#6B7280" font-family="Arial, sans-serif" font-size="26" font-weight="700"><tspan x="890" dy="0">B − A per question</tspan></text><path d="M30 197H1370" stroke="#E5E7EB"/><text x="45" y="177" fill="#111827" font-family="Arial, sans-serif" font-size="29" font-weight="400"><tspan x="45" dy="0">Both correct</tspan></text><text x="620" y="177" fill="#7253ED" font-family="Arial, sans-serif" font-size="31" font-weight="700"><tspan x="620" dy="0">380</tspan></text><text x="990" y="177" fill="#7253ED" font-family="Arial, sans-serif" font-size="31" font-weight="700"><tspan x="990" dy="0">0</tspan></text><path d="M30 267H1370" stroke="#E5E7EB"/><text x="45" y="247" fill="#111827" font-family="Arial, sans-serif" font-size="29" font-weight="400"><tspan x="45" dy="0">Only A correct</tspan></text><text x="620" y="247" fill="#7253ED" font-family="Arial, sans-serif" font-size="31" font-weight="700"><tspan x="620" dy="0">20</tspan></text><text x="990" y="247" fill="#7253ED" font-family="Arial, sans-serif" font-size="31" font-weight="700"><tspan x="990" dy="0">−1</tspan></text><path d="M30 337H1370" stroke="#E5E7EB"/><text x="45" y="317" fill="#111827" font-family="Arial, sans-serif" font-size="29" font-weight="400"><tspan x="45" dy="0">Only B correct</tspan></text><text x="620" y="317" fill="#7253ED" font-family="Arial, sans-serif" font-size="31" font-weight="700"><tspan x="620" dy="0">30</tspan></text><text x="990" y="317" fill="#7253ED" font-family="Arial, sans-serif" font-size="31" font-weight="700"><tspan x="990" dy="0">+1</tspan></text><path d="M30 407H1370" stroke="#E5E7EB"/><text x="45" y="387" fill="#111827" font-family="Arial, sans-serif" font-size="29" font-weight="400"><tspan x="45" dy="0">Both wrong</tspan></text><text x="620" y="387" fill="#7253ED" font-family="Arial, sans-serif" font-size="31" font-weight="700"><tspan x="620" dy="0">70</tspan></text><text x="990" y="387" fill="#7253ED" font-family="Arial, sans-serif" font-size="31" font-weight="700"><tspan x="990" dy="0">0</tspan></text><text x="45" y="464" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="45" dy="0">A: 380 + 20 = 400 correct → 80%</tspan></text><text x="740" y="464" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="740" dy="0">B: 380 + 30 = 410 correct → 82%</tspan></text><rect x="30" y="490" width="1340" height="80" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="54" y="541" fill="#7253ED" font-family="Arial, sans-serif" font-size="30" font-weight="700"><tspan x="54" dy="0">30 gains − 20 losses = 10 net gains; 10 ÷ 500 = +2 percentage points</tspan></text></svg>
