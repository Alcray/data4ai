<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img"><title>Continue the same 500-question example. Squared deviations total 49.8; dividing by 499 gives variance 0.0998. The standard error of the paired mean is 0.01413, or 1.41 percentage points.</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#7253ED"/></marker></defs><text x="30" y="43" fill="#111827" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="30" dy="0">Same 500 questions. Mean paired difference: 0.02.</tspan></text><text x="45" y="116" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="700"><tspan x="45" dy="0">Paired differences</tspan></text><text x="595" y="116" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="700"><tspan x="595" dy="0">Distance from mean, squared</tspan></text><text x="1150" y="116" fill="#6B7280" font-family="Arial, sans-serif" font-size="25" font-weight="700"><tspan x="1150" dy="0">Contribution</tspan></text><text x="45" y="168" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="45" dy="0">450 ties: difference 0</tspan></text><text x="595" y="168" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="595" dy="0">450 × (0 − 0.02)²</tspan></text><text x="1160" y="168" fill="#7253ED" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="1160" dy="0">0.180</tspan></text><text x="45" y="244" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="45" dy="0">20 losses: difference −1</tspan></text><text x="595" y="244" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="595" dy="0">20 × (−1 − 0.02)²</tspan></text><text x="1160" y="244" fill="#7253ED" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="1160" dy="0">20.808</tspan></text><text x="45" y="320" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="45" dy="0">30 gains: difference +1</tspan></text><text x="595" y="320" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="595" dy="0">30 × (1 − 0.02)²</tspan></text><text x="1160" y="320" fill="#7253ED" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="1160" dy="0">28.812</tspan></text><text x="45" y="397" fill="#7253ED" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="45" dy="0">Sum of squared deviations: 49.8</tspan></text><rect x="30" y="424" width="400" height="124" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="50" y="455" fill="#6B7280" font-family="Arial, sans-serif" font-size="24" font-weight="400"><tspan x="50" dy="0">1. Sample variance</tspan></text><text x="50" y="494" fill="#7253ED" font-family="Arial, sans-serif" font-size="33" font-weight="700"><tspan x="50" dy="0">0.0998</tspan></text><text x="50" y="529" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="400"><tspan x="50" dy="0">49.8 ÷ 499</tspan></text><path d="M430 486L485 486" fill="none" stroke="#7253ED" stroke-width="2" marker-end="url(#arrow)"/><rect x="485" y="424" width="400" height="124" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="505" y="455" fill="#6B7280" font-family="Arial, sans-serif" font-size="24" font-weight="400"><tspan x="505" dy="0">2. Standard deviation</tspan></text><text x="505" y="494" fill="#7253ED" font-family="Arial, sans-serif" font-size="33" font-weight="700"><tspan x="505" dy="0">0.3159</tspan></text><text x="505" y="529" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="400"><tspan x="505" dy="0">√0.0998</tspan></text><path d="M885 486L940 486" fill="none" stroke="#7253ED" stroke-width="2" marker-end="url(#arrow)"/><rect x="940" y="424" width="400" height="124" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="960" y="455" fill="#6B7280" font-family="Arial, sans-serif" font-size="24" font-weight="400"><tspan x="960" dy="0">3. Standard error</tspan></text><text x="960" y="494" fill="#7253ED" font-family="Arial, sans-serif" font-size="33" font-weight="700"><tspan x="960" dy="0">0.01413</tspan></text><text x="960" y="529" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="400"><tspan x="960" dy="0">0.3159 ÷ √500</tspan></text><text x="30" y="589" fill="#6B7280" font-family="Arial, sans-serif" font-size="26" font-weight="400"><tspan x="30" dy="0">Standard error: 1.41 percentage points, assuming independent task pairs.</tspan></text></svg>
