<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img"><title>A constructed math benchmark groups equation, area, and remainder variants into three seed families. A toy bootstrap draw selects family two twice and family one once, carrying every variant and both models’ outcomes together. These are not official MATH-500 family labels.</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#7253ED"/></marker></defs><text x="30" y="43" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="30" dy="0">Constructed math benchmark: each family shares one seed or solution template.</tspan></text><rect x="30" y="88" width="430" height="226" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/><text x="48" y="129" fill="#7253ED" font-family="Arial, sans-serif" font-size="27" font-weight="700"><tspan x="48" dy="0">F1 · One-step equation</tspan></text><text x="48" y="181" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="48" dy="0">Solve x + 3 = 7. → 4</tspan></text><text x="48" y="229" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="48" dy="0">A number plus 3 is 7. → 4</tspan></text><text x="48" y="277" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="48" dy="0">Solve x + 5 = 11. → 6</tspan></text><rect x="485" y="88" width="430" height="226" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/><text x="503" y="129" fill="#7253ED" font-family="Arial, sans-serif" font-size="27" font-weight="700"><tspan x="503" dy="0">F2 · Rectangle area</tspan></text><text x="503" y="181" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="503" dy="0">Sides 3 and 4: area? → 12</tspan></text><text x="503" y="229" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="503" dy="0">3-by-4 garden: area? → 12</tspan></text><text x="503" y="277" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="503" dy="0">Sides 5 and 6: area? → 30</tspan></text><rect x="940" y="88" width="430" height="226" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/><text x="958" y="129" fill="#7253ED" font-family="Arial, sans-serif" font-size="27" font-weight="700"><tspan x="958" dy="0">F3 · Integer remainder</tspan></text><text x="958" y="181" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="958" dy="0">23 divided by 5: left? → 3</tspan></text><text x="958" y="229" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="958" dy="0">23 beads in groups of 5. → 3</tspan></text><text x="958" y="277" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="400"><tspan x="958" dy="0">34 divided by 6: left? → 4</tspan></text><text x="30" y="365" fill="#111827" font-family="Arial, sans-serif" font-size="29" font-weight="700"><tspan x="30" dy="0">One bootstrap draw of 3 families, with replacement:</tspan></text><rect x="30" y="395" width="430" height="75" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="54" y="443" fill="#7253ED" font-family="Arial, sans-serif" font-size="30" font-weight="700"><tspan x="54" dy="0">F2 + all variants</tspan></text><rect x="485" y="395" width="430" height="75" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="509" y="443" fill="#7253ED" font-family="Arial, sans-serif" font-size="30" font-weight="700"><tspan x="509" dy="0">F2 + all variants</tspan></text><rect x="940" y="395" width="430" height="75" rx="8" fill="#F2EFFE" stroke="#E5E7EB" stroke-width="2"/><text x="964" y="443" fill="#7253ED" font-family="Arial, sans-serif" font-size="30" font-weight="700"><tspan x="964" dy="0">F1 + all variants</tspan></text><text x="30" y="516" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="400"><tspan x="30" dy="0">Keep A and B outcomes together for every variant; recompute the gain.</tspan></text><text x="30" y="564" fill="#6B7280" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="30" dy="0">F2 is repeated; F3 is absent in this draw. Repeat many times for an interval.</tspan></text></svg>
